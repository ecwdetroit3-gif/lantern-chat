<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="description" content="A private AI chat page. Bring your own API key.">
<title>Lantern Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* Layout: two-pane chat — a quiet chat list on the left, one reading column with a docked composer on the right. Amber is the only accent: it marks Claude and the send action. */
:root {
  --bg: #F2F3EF;
  --surface: #FFFFFF;
  --sunk: #E8EAE4;
  --ink: #1B2026;
  --muted: #5E6570;
  --line: #D9DCD4;
  --accent: #A85D0C;
  --accent-soft: #F6E7D2;
  --accent-ink: #FFFFFF;
  --danger: #A8321F;
  --code-bg: #EEF0EA;
  --shadow: 0 1px 2px rgba(27,32,38,.06), 0 8px 24px rgba(27,32,38,.06);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121519; --surface: #1B1F25; --sunk: #232830; --ink: #E9E7E2; --muted: #9AA1AA;
    --line: #2D323A; --accent: #F0A23A; --accent-soft: #3A2A14; --accent-ink: #1C1206;
    --danger: #F08A73; --code-bg: #171B20; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121519; --surface: #1B1F25; --sunk: #232830; --ink: #E9E7E2; --muted: #9AA1AA;
  --line: #2D323A; --accent: #F0A23A; --accent-soft: #3A2A14; --accent-ink: #1C1206;
  --danger: #F08A73; --code-bg: #171B20; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); height: 100%; }

/* Sidebar */
.side {
  display: flex; flex-direction: column; gap: 12px; min-height: 0;
  padding: 16px 12px; border-right: 1px solid var(--line); background: var(--bg);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 8px; }
.brand svg { flex: none; }
.brand b { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
.new-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 500;
}
.new-btn:hover { border-color: var(--accent); }
.list-label {
  font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); padding: 8px 8px 0;
}
.chat-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; min-height: 0; flex: 1; }
.chat-item { display: flex; align-items: center; border-radius: 8px; }
.chat-item:hover, .chat-item.active { background: var(--sunk); }
.chat-item .open {
  flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 8px 10px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px;
}
.chat-item.active .open { font-weight: 500; }
.chat-item .del {
  border: 0; background: none; color: var(--muted); padding: 6px 8px; opacity: 0; border-radius: 6px;
}
.chat-item:hover .del, .chat-item.active .del, .chat-item .del:focus-visible { opacity: 1; }
.chat-item .del:hover { color: var(--danger); }
.chat-item.confirming { background: var(--accent-soft); }
.confirm-row { display: flex; gap: 6px; padding: 6px 8px; align-items: center; font-size: 13px; width: 100%; }
.confirm-row span { flex: 1; }
.confirm-row button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 2px 8px; font-size: 12px; }
.confirm-row .yes { color: var(--danger); }
.empty-list { color: var(--muted); font-size: 13px; padding: 8px; }
.storage-note { font-size: 12px; color: var(--muted); padding: 8px; border-top: 1px solid var(--line); }

/* Main */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface); }
.top {
  display: flex; align-items: center; gap: 12px; padding: 10px 20px;
  border-bottom: 1px solid var(--line);
}
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; }
.chat-title { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tiers { display: flex; padding: 3px; gap: 2px; background: var(--sunk); border-radius: 10px; }
.tiers button {
  border: 0; background: none; padding: 5px 12px; border-radius: 8px; font-size: 13px; color: var(--muted);
}
.tiers button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 500; box-shadow: var(--shadow); }

.scroll { flex: 1; overflow-y: auto; min-height: 0; }
.thread { max-width: 760px; margin: 0 auto; padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 28px; }

.msg { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.msg.user { align-items: flex-end; }
.msg.user .bubble {
  background: var(--sunk); padding: 10px 16px; border-radius: 16px 16px 4px 16px;
  max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere;
}
.msg.ai .who { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.msg.ai .who .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.msg.ai.streaming .who .dot { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.md { min-width: 0; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md blockquote, .md pre, .md table { margin: 0 0 .85em; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--f-display); font-weight: 700; line-height: 1.25; margin: 1.2em 0 .5em; text-wrap: balance; }
.md h1 { font-size: 1.45em; } .md h2 { font-size: 1.25em; } .md h3 { font-size: 1.1em; } .md h4 { font-size: 1em; }
.md ul, .md ol { padding-left: 1.4em; }
.md li + li { margin-top: .25em; }
.md a { color: var(--accent); }
.md code { font-family: var(--f-mono); font-size: .88em; background: var(--code-bg); padding: .1em .35em; border-radius: 4px; }
.md pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; }
.md pre code { background: none; padding: 0; font-size: 13px; line-height: 1.55; }
.md blockquote { border-left: 3px solid var(--line); padding-left: 12px; color: var(--muted); }
.md .tbl { overflow-x: auto; margin: 0 0 .85em; }
.md table { border-collapse: collapse; font-size: 14px; margin: 0; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.md th { background: var(--sunk); font-weight: 600; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }
.thinking { color: var(--muted); font-style: italic; }
.actions { display: flex; gap: 4px; }
.actions button {
  border: 0; background: none; color: var(--muted); font-size: 12px; padding: 4px 8px; border-radius: 6px;
  display: inline-flex; align-items: center; gap: 5px;
}
.actions button:hover { background: var(--sunk); color: var(--ink); }
.note { font-size: 13px; color: var(--danger); }
.note.soft { color: var(--muted); }

/* Empty state */
.welcome { padding-top: 6vh; display: flex; flex-direction: column; gap: 22px; }
.welcome h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(28px, 5vw, 40px); line-height: 1.1; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.welcome h1 em { font-style: normal; color: var(--accent); }
.welcome p { margin: 0; color: var(--muted); max-width: 52ch; }
.starters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.starter {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
  padding: 12px 14px; display: flex; flex-direction: column; gap: 2px;
}
.starter:hover { border-color: var(--accent); }
.starter small { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.starter span { font-size: 14px; }

/* Composer */
.dock { padding: 8px 20px 16px; }
.composer {
  max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 8px 8px 8px 16px;
  box-shadow: var(--shadow);
}
.composer:focus-within { border-color: var(--accent); }
.composer textarea {
  flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: none; color: var(--ink);
  font: inherit; line-height: 1.5; padding: 6px 0; max-height: 220px;
}
.composer textarea::placeholder { color: var(--muted); }
.send {
  flex: none; width: 38px; height: 38px; border-radius: 10px; border: 0;
  background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
}
.send:disabled { opacity: .4; cursor: default; }
.send.stop { background: var(--ink); color: var(--surface); }
.hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); text-align: center; }
.hint kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

.offline {
  max-width: 760px; margin: 0 auto 8px; font-size: 13px; padding: 10px 14px; border-radius: 10px;
  background: var(--accent-soft); color: var(--ink);
}

.scrim { display: none; }
.lock { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; padding: 16px; }
.lock-card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.lock-card h1 { font-family: var(--f-display); font-size: 26px; margin: 0; letter-spacing: -.01em; }
.lock-card p { margin: 0; color: var(--muted); }
.lock-card input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.lock-card button { border: 0; border-radius: 10px; padding: 10px 14px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.lock-card .err { color: var(--danger); font-size: 13px; }
.lock { overflow-y: auto; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500; }
.field em { font-style: normal; font-weight: 400; color: var(--muted); }
.lock-card select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.lock-card input:focus, .lock-card select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.setup-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.lock-card button.ghost { background: none; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.lock-card button.ghost.danger { color: var(--danger); margin-right: auto; }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; font-size: 12px; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side {
    position: fixed; inset: 0 auto 0 0; width: min(300px, 84vw); z-index: 20;
    padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--surface); transform: translateX(-100%); transition: transform .2s ease;
  }
  .app.nav-open .side { transform: none; box-shadow: var(--shadow); }
  .app.nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.35); border: 0; }
  .menu-btn { display: inline-flex; }
  .top { padding: 10px 16px; }
  .thread { padding: 20px 16px; }
  .dock { padding: 8px 16px 12px; }
  .starters { grid-template-columns: minmax(0, 1fr); }
  .tiers button { padding: 5px 9px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .side { transition: none; }
  .msg.ai.streaming .who .dot { animation: none; }
}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} [hidden]{display:none!important} *{box-sizing:border-box}</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="Chats">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <rect x="9" y="1.5" width="8" height="3" rx="1.5" fill="var(--ink)"/>
        <path d="M6 7.5h14l-1.6 14.5a2 2 0 0 1-2 1.8H9.6a2 2 0 0 1-2-1.8L6 7.5z" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <circle cx="13" cy="15" r="3.6" fill="var(--accent)"/>
      </svg>
      <b>Lantern</b>
    </div>
    <button class="new-btn" id="newChat" type="button">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      New chat
    </button>
    <div class="list-label">Recent</div>
    <ul class="chat-list" id="chatList"></ul>
    <div class="storage-note"><span id="storageNote">Not connected yet.</span> <button type="button" class="link-btn" id="openSettings">AI settings</button></div>
  </aside>
  <button class="scrim" id="scrim" type="button" aria-label="Close chat list"></button>

  <main class="main">
    <header class="top">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Open chat list">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="chat-title" id="chatTitle">New chat</div>
      <div class="tiers" role="group" aria-label="Response style">
        <button type="button" data-tier="quick" aria-pressed="false" title="Fastest replies">Quick</button>
        <button type="button" data-tier="default" aria-pressed="true" title="Balanced speed and depth">Balanced</button>
        <button type="button" data-tier="complex" aria-pressed="false" title="Thinks longest, for hard problems">Deep</button>
      </div>
    </header>

    <div class="scroll" id="scroll">
      <div class="thread" id="thread"></div>
    </div>

    <div class="dock">
      <div class="offline" id="offline" hidden></div>
      <form class="composer" id="composer">
        <textarea id="input" aria-label="Message" rows="1" placeholder="Send a message…" autocomplete="off"></textarea>
        <button class="send" id="sendBtn" type="submit" aria-label="Send" disabled>
          <svg id="sendIcon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 14V4M4.5 8.5 9 4l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <div class="hint"><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line · Replies use your own API key</div>
    </div>
  </main>
</div>

<div class="lock" id="lock" hidden>
  <form class="lock-card" id="setupForm" autocomplete="off">
    <h1>Connect your AI</h1>
    <p>Paste an API key from any AI company. Lantern saves it in this browser only and sends it only to that company.</p>
    <label class="field"><span>API key</span>
      <input id="setKey" type="password" placeholder="sk-ant-…, AIza…, sk-…, gsk_…" spellcheck="false">
    </label>
    <label class="field"><span>AI company</span>
      <select id="setProvider">
        <option value="auto">Detect from my key</option>
        <option value="gemini">Google Gemini</option>
        <option value="anthropic">Anthropic (Claude)</option>
        <option value="openai">OpenAI (GPT)</option>
        <option value="groq">Groq</option>
        <option value="openrouter">OpenRouter</option>
        <option value="custom">Other (OpenAI-compatible)</option>
      </select>
    </label>
    <label class="field" id="baseField" hidden><span>API address</span>
      <input id="setBase" type="url" placeholder="https://api.deepseek.com/v1" spellcheck="false">
    </label>
    <label class="field"><span>Model <em>optional</em></span>
      <input id="setModel" type="text" placeholder="Leave blank for the defaults" spellcheck="false">
    </label>
    <div class="err" id="setErr" hidden></div>
    <div class="setup-actions">
      <button type="button" class="ghost danger" id="setForget" hidden>Remove key</button>
      <button type="button" class="ghost" id="setCancel" hidden>Cancel</button>
      <button type="submit">Save and start</button>
    </div>
  </form>
</div>
<script>
(() => {
  const STARTERS = [
    { tag: "Explain", text: "Explain how video games save your progress, step by step." },
    { tag: "Write", text: "Write a short, funny birthday message for my best friend." },
    { tag: "Plan", text: "Help me make a study plan for a big test in two weeks." },
    { tag: "Brainstorm", text: "Give me 10 cool name ideas for a gaming YouTube channel." }
  ];

  const $ = (id) => document.getElementById(id);
  const app = $("app"), thread = $("thread"), scroll = $("scroll"), input = $("input"),
        sendBtn = $("sendBtn"), chatList = $("chatList"), chatTitle = $("chatTitle"),
        lock = $("lock"), setupForm = $("setupForm"), setErr = $("setErr");

  const state = {
    chats: new Map(), currentId: null, tier: "default",
    streaming: null, confirmDelete: null, lastError: null, cfg: null, aiName: "AI"
  };

  // ---------- AI companies ----------
  const SYSTEM = [
    "You are a helpful AI assistant inside a personal chat website called Lantern.",
    "Be warm, direct and genuinely helpful. Use Markdown when formatting helps (lists, headings, tables, fenced code blocks with a language tag); keep casual replies short.",
    "You cannot browse the web, see files, or remember anything outside this conversation. If asked for live information, say so plainly and help with what you know."
  ].join("\n");

  // Default models for Quick / Balanced / Deep. A model typed in settings replaces all three.
  const PROVIDERS = {
    anthropic: { name: "Claude", label: "Anthropic", base: "https://api.anthropic.com/v1",
      models: { quick: "claude-haiku-5-5", default: "claude-sonnet-5-5", complex: "claude-opus-5-5" } },
    openai: { name: "GPT", label: "OpenAI", base: "https://api.openai.com/v1",
      models: { quick: "gpt-5.6-luna", default: "gpt-5.6-terra", complex: "gpt-5.6-sol" } },
    gemini: { name: "Gemini", label: "Google Gemini", base: "https://generativelanguage.googleapis.com/v1beta",
      models: { quick: "gemini-3.1-flash-lite", default: "gemini-3.5-flash", complex: "gemini-3.1-pro-preview" } },
    groq: { name: "AI", label: "Groq", base: "https://api.groq.com/openai/v1",
      models: { quick: "llama-3.1-8b-instant", default: "llama-3.3-70b-versatile", complex: "llama-3.3-70b-versatile" } },
    openrouter: { name: "AI", label: "OpenRouter", base: "https://openrouter.ai/api/v1",
      models: { quick: "openrouter/auto", default: "openrouter/auto", complex: "openrouter/auto" } },
    custom: { name: "AI", label: "your AI service", base: "", models: { quick: null, default: null, complex: null } }
  };

  function detect(key) {
    if (key.startsWith("sk-ant-")) return "anthropic";
    if (key.startsWith("AIza")) return "gemini";
    if (key.startsWith("sk-or-")) return "openrouter";
    if (key.startsWith("gsk_")) return "groq";
    if (key.startsWith("sk-")) return "openai";
    return null;
  }

  // Turns saved settings into a ready-to-use connection, or an error message.
  function buildCfg(saved) {
    if (!saved || !saved.key) return { error: "Paste an API key to get started." };
    const id = saved.provider === "auto" || !saved.provider ? detect(saved.key) : saved.provider;
    if (!id) return { error: "Lantern couldn't tell which company this key is from. Choose it under AI company." };
    const p = PROVIDERS[id];
    const base = (id === "custom" ? (saved.base || "") : p.base).replace(/\/+$/, "");
    if (id === "custom" && !/^https?:\/\//.test(base)) return { error: "Enter the service's API address, like https://api.deepseek.com/v1." };
    const m = (saved.model || "").trim();
    const models = { quick: m || p.models.quick, default: m || p.models.default, complex: m || p.models.complex };
    if (!models.default) return { error: "Enter the model name to use for this service." };
    return { id, key: saved.key, base, models, name: p.name, label: p.label };
  }

  function loadSaved() { try { return JSON.parse(localStorage.getItem("lantern.ai") || "null"); } catch (e) { return null; } }
  function applyCfg(cfg) {
    state.cfg = cfg; state.aiName = cfg.name;
    document.querySelectorAll(".who-name").forEach(n => { n.textContent = cfg.name; });
    input.placeholder = "Message " + cfg.name + "…";
    $("storageNote").textContent = "Connected to " + cfg.label + ". Chats are saved in this browser only.";
    setSendMode();
  }

  function openSettings(message) {
    const saved = loadSaved() || {};
    $("setKey").value = saved.key || "";
    $("setProvider").value = saved.provider || "auto";
    $("setBase").value = saved.base || "";
    $("setModel").value = saved.model || "";
    $("baseField").hidden = $("setProvider").value !== "custom";
    $("setCancel").hidden = !state.cfg;
    $("setForget").hidden = !saved.key;
    setErr.hidden = !message; setErr.textContent = message || "";
    lock.hidden = false; closeNav();
    $("setKey").focus();
  }
  $("setProvider").addEventListener("change", () => { $("baseField").hidden = $("setProvider").value !== "custom"; });
  $("setCancel").onclick = () => { lock.hidden = true; input.focus(); };
  $("setForget").onclick = () => {
    try { localStorage.removeItem("lantern.ai"); } catch (e) {}
    state.cfg = null; $("storageNote").textContent = "Not connected yet.";
    openSettings("Key removed from this browser.");
    $("setForget").hidden = true; $("setCancel").hidden = true;
  };
  $("openSettings").onclick = () => openSettings();
  setupForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const saved = { key: $("setKey").value.trim(), provider: $("setProvider").value, base: $("setBase").value.trim(), model: $("setModel").value.trim() };
    const cfg = buildCfg(saved);
    if (cfg.error) { setErr.textContent = cfg.error; setErr.hidden = false; return; }
    try { localStorage.setItem("lantern.ai", JSON.stringify(saved)); } catch (e2) {}
    applyCfg(cfg);
    lock.hidden = true; input.focus();
  });

  // One request per company, straight from the browser.
  function callAI(cfg, model, messages, signal) {
    if (cfg.id === "anthropic") {
      return fetch(cfg.base + "/messages", {
        method: "POST", signal,
        headers: { "content-type": "application/json", "x-api-key": cfg.key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({ model, max_tokens: 8192, system: SYSTEM, messages, stream: true })
      });
    }
    if (cfg.id === "gemini") {
      return fetch(cfg.base + "/models/" + encodeURIComponent(model) + ":streamGenerateContent?alt=sse", {
        method: "POST", signal,
        headers: { "content-type": "application/json", "x-goog-api-key": cfg.key },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: SYSTEM }] },
          contents: messages.map(m => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] }))
        })
      });
    }
    const headers = { "content-type": "application/json", authorization: "Bearer " + cfg.key };
    if (cfg.id === "openrouter") headers["x-title"] = "Lantern";
    return fetch(cfg.base + "/chat/completions", {
      method: "POST", signal, headers,
      body: JSON.stringify({ model, stream: true, messages: [{ role: "system", content: SYSTEM }, ...messages] })
    });
  }

  // Pull the text out of one streamed event, in each company's format.
  function readEvent(cfg, ev) {
    if (cfg.id === "anthropic") {
      if (ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta") return { text: ev.delta.text };
      if (ev.type === "message_delta" && ev.delta && ev.delta.stop_reason === "max_tokens") return { truncated: true };
      if (ev.type === "error") return { error: ev.error && ev.error.type === "overloaded_error" ? "The AI is busy right now. Try again in a moment." : "The reply stopped early. Try again." };
      return null;
    }
    if (cfg.id === "gemini") {
      const c = ev.candidates && ev.candidates[0];
      if (!c) return ev.error ? { error: ev.error.message || "The reply stopped early. Try again." } : null;
      const text = ((c.content && c.content.parts) || []).map(p => (p.thought ? "" : p.text || "")).join("");
      const out = {};
      if (text) out.text = text;
      if (c.finishReason === "MAX_TOKENS") out.truncated = true;
      if (c.finishReason === "SAFETY" || c.finishReason === "PROHIBITED_CONTENT") out.error = "The AI wouldn't answer that one. Try asking a different way.";
      return Object.keys(out).length ? out : null;
    }
    if (ev.error) return { error: ev.error.message || "The reply stopped early. Try again." };
    const ch = ev.choices && ev.choices[0];
    if (!ch) return null;
    const out = {};
    if (ch.delta && typeof ch.delta.content === "string" && ch.delta.content) out.text = ch.delta.content;
    if (ch.finish_reason === "length") out.truncated = true;
    return Object.keys(out).length ? out : null;
  }

  async function errorFor(cfg, res, model) {
    let detail = "";
    try {
      const j = await res.json();
      const e = Array.isArray(j) ? j[0] && j[0].error : j.error;
      detail = (e && (e.message || (typeof e === "string" ? e : ""))) || "";
    } catch (e) {}
    const s = res.status;
    const err = new Error();
    if (s === 401 || (s === 403 && /key|auth|permission/i.test(detail)) || (s === 400 && /api key/i.test(detail))) { err.badKey = true; err.message = "Your " + cfg.label + " API key was rejected. Check it in AI settings."; }
    else if (s === 402) err.message = "Your " + cfg.label + " account is out of credit.";
    else if (s === 404 || (s === 400 && /model/i.test(detail))) err.message = 'The model "' + model + '" isn\'t available on your account. Enter a different model in AI settings.';
    else if (s === 429) err.message = "Too many messages too fast, or you've hit your plan's limit. Wait a bit and try again.";
    else if (s >= 500) err.message = "The AI is busy or having problems right now. Try again in a moment.";
    else err.message = ("The AI returned an error. " + detail).trim();
    return err;
  }

  // ---------- helpers ----------
  const uidGen = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const titleFrom = (t) => { const s = t.replace(/\s+/g, " ").trim(); return s.length > 48 ? s.slice(0, 46) + "…" : s || "New chat"; };
  const current = () => state.chats.get(state.currentId) || null;
  const bytes = (s) => new Blob([s]).size;

  function renderMd(text) {
    try {
      if (window.marked && window.DOMPurify) {
        const html = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: false }));
        const tmp = document.createElement("div");
        tmp.innerHTML = html;
        tmp.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
        tmp.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tbl"; t.replaceWith(w); w.appendChild(t); });
        return tmp.innerHTML;
      }
    } catch (e) {}
    const d = document.createElement("div"); d.textContent = text; d.style.whiteSpace = "pre-wrap";
    return d.outerHTML;
  }
  function nearBottom() { return scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 120; }
  function toBottom() { scroll.scrollTop = scroll.scrollHeight; }

  // ---------- rendering ----------
  function renderList() {
    const chats = [...state.chats.values()].filter(c => c.messages.length).sort((a, b) => b.updatedAt - a.updatedAt);
    chatList.innerHTML = "";
    if (!chats.length) {
      const li = document.createElement("li"); li.className = "empty-list";
      li.textContent = "Your chats will show up here.";
      chatList.appendChild(li); return;
    }
    for (const c of chats) {
      const li = document.createElement("li");
      li.className = "chat-item" + (c.id === state.currentId ? " active" : "");
      if (state.confirmDelete === c.id) {
        li.classList.add("confirming");
        const row = document.createElement("div"); row.className = "confirm-row";
        const s = document.createElement("span"); s.textContent = "Delete this chat?";
        const yes = document.createElement("button"); yes.type = "button"; yes.className = "yes"; yes.textContent = "Delete";
        yes.onclick = () => deleteChat(c.id);
        const no = document.createElement("button"); no.type = "button"; no.textContent = "Keep";
        no.onclick = () => { state.confirmDelete = null; renderList(); };
        row.append(s, yes, no); li.appendChild(row);
      } else {
        const open = document.createElement("button"); open.type = "button"; open.className = "open";
        open.textContent = c.title; open.title = c.title;
        open.onclick = () => openChat(c.id);
        const del = document.createElement("button"); del.type = "button"; del.className = "del";
        del.setAttribute("aria-label", "Delete " + c.title);
        del.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 4h8M5.5 4V2.8h3V4M4 4l.6 7.2h4.8L10 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        del.onclick = () => { state.confirmDelete = c.id; renderList(); };
        li.append(open, del);
      }
      chatList.appendChild(li);
    }
  }

  function renderWelcome() {
    const w = document.createElement("section"); w.className = "welcome";
    const h = document.createElement("h1"); h.innerHTML = "What are we <em>working on</em> today?";
    const p = document.createElement("p");
    p.textContent = "Ask anything: homework, code, game ideas, writing, or just talk it through. Pick Quick for fast answers or Deep for hard problems.";
    const g = document.createElement("div"); g.className = "starters";
    for (const s of STARTERS) {
      const b = document.createElement("button"); b.type = "button"; b.className = "starter";
      const sm = document.createElement("small"); sm.textContent = s.tag;
      const sp = document.createElement("span"); sp.textContent = s.text;
      b.append(sm, sp);
      b.onclick = () => { input.value = s.text; autosize(); send(); };
      g.appendChild(b);
    }
    w.append(h, p, g);
    return w;
  }

  function aiNode(text, opts = {}) {
    const m = document.createElement("div"); m.className = "msg ai" + (opts.streaming ? " streaming" : "");
    const who = document.createElement("div"); who.className = "who";
    who.innerHTML = '<span class="dot"></span><span class="who-name"></span>';
    who.querySelector(".who-name").textContent = state.aiName;
    const body = document.createElement("div"); body.className = "md";
    body.innerHTML = text ? renderMd(text) : '<p class="thinking">Thinking…</p>';
    m.append(who, body);
    if (opts.actions) {
      const a = document.createElement("div"); a.className = "actions";
      const copy = document.createElement("button"); copy.type = "button";
      copy.innerHTML = '<svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2 8.5V3a1 1 0 0 1 1-1h5.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg><span>Copy</span>';
      copy.onclick = async () => {
        const label = copy.querySelector("span");
        try { await navigator.clipboard.writeText(text); label.textContent = "Copied"; }
        catch (e) { const r = document.createRange(); r.selectNodeContents(body); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); label.textContent = "Selected — press Ctrl+C"; }
        setTimeout(() => { label.textContent = "Copy"; }, 1800);
      };
      a.appendChild(copy);
      if (opts.regen) {
        const re = document.createElement("button"); re.type = "button";
        re.innerHTML = '<svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true"><path d="M10.5 6.5a4 4 0 1 1-1.2-2.85M10.5 2v2.5H8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Try again</span>';
        re.onclick = regenerate;
        a.appendChild(re);
      }
      m.appendChild(a);
    }
    return m;
  }

  function renderThread() {
    const c = current();
    thread.innerHTML = "";
    chatTitle.textContent = c && c.messages.length ? c.title : "New chat";
    if (!c || !c.messages.length) { thread.appendChild(renderWelcome()); return; }
    const streamingHere = state.streaming && state.streaming.chatId === c.id;
    c.messages.forEach((msg, i) => {
      if (msg.role === "user") {
        const m = document.createElement("div"); m.className = "msg user";
        const b = document.createElement("div"); b.className = "bubble"; b.textContent = msg.content;
        m.appendChild(b); thread.appendChild(m);
      } else {
        const isLast = i === c.messages.length - 1;
        const node = aiNode(msg.content, { actions: true, regen: isLast && !streamingHere });
        if (msg.interrupted) { const n = document.createElement("div"); n.className = "note soft"; n.textContent = "Reply was cut off."; node.appendChild(n); }
        thread.appendChild(node);
      }
    });
    const last = c.messages[c.messages.length - 1];
    if (!streamingHere && last.role === "user" && state.lastError && state.lastError.chatId === c.id) {
      const m = document.createElement("div"); m.className = "msg ai";
      const n = document.createElement("div"); n.className = "note"; n.textContent = state.lastError.message;
      const a = document.createElement("div"); a.className = "actions";
      const re = document.createElement("button"); re.type = "button"; re.innerHTML = "<span>Try again</span>";
      re.onclick = () => { state.lastError = null; runReply(c.id); };
      a.appendChild(re); m.append(n, a);
      thread.appendChild(m);
    }
  }

  function setSendMode() {
    const busy = !!state.streaming;
    sendBtn.classList.toggle("stop", busy);
    sendBtn.setAttribute("aria-label", busy ? "Stop" : "Send");
    sendBtn.innerHTML = busy
      ? '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="2" width="10" height="10" rx="2" fill="currentColor"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 14V4M4.5 8.5 9 4l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    sendBtn.disabled = busy ? false : !input.value.trim();
  }
  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 220) + "px"; setSendMode(); }

  // ---------- storage (this browser) ----------
  function saveLocal() {
    try {
      let arr = [...state.chats.values()].filter(c => c.messages.length)
        .sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 50)
        .map(c => ({ id: c.id, title: c.title, updatedAt: c.updatedAt, messages: c.messages }));
      while (arr.length > 1 && bytes(JSON.stringify(arr)) > 4000000) arr.pop();
      localStorage.setItem("lantern.chats", JSON.stringify(arr));
    } catch (e) {}
  }
  function loadLocal() {
    try {
      const arr = JSON.parse(localStorage.getItem("lantern.chats") || "[]");
      for (const c of arr) if (c && c.id && Array.isArray(c.messages)) state.chats.set(c.id, c);
    } catch (e) {}
  }
  function deleteChat(id) {
    state.confirmDelete = null;
    if (state.streaming && state.streaming.chatId === id) state.streaming.ctl.abort();
    state.chats.delete(id);
    if (state.currentId === id) newChat();
    renderList(); saveLocal();
  }

  // ---------- chat actions ----------
  function newChat() {
    if (state.streaming) return;
    const c = { id: uidGen(), title: "New chat", updatedAt: Date.now(), messages: [] };
    state.chats.set(c.id, c); state.currentId = c.id; state.lastError = null;
    renderList(); renderThread(); closeNav();
  }
  function openChat(id) {
    const prev = current(); if (prev && !prev.messages.length && prev.id !== id) state.chats.delete(prev.id);
    state.currentId = id; state.confirmDelete = null; state.lastError = null;
    renderList(); renderThread(); closeNav(); toBottom();
  }
  function send() {
    const text = input.value.trim();
    if (!text || state.streaming) return;
    if (!state.cfg) { openSettings(); return; }
    let c = current(); if (!c) { newChat(); c = current(); }
    if (!c.messages.length) c.title = titleFrom(text);
    c.messages.push({ role: "user", content: text });
    c.updatedAt = Date.now();
    input.value = ""; autosize();
    state.lastError = null;
    renderList(); renderThread(); toBottom(); saveLocal();
    runReply(c.id);
  }
  function regenerate() {
    const c = current(); if (!c || state.streaming) return;
    if (c.messages.length && c.messages[c.messages.length - 1].role === "assistant") c.messages.pop();
    renderThread(); runReply(c.id);
  }
  function buildTurns(messages) {
    let turns = messages.map(m => ({ role: m.role, content: m.content })).filter(m => m.content);
    while (turns.length > 1 && bytes(JSON.stringify(turns)) > 150000) {
      turns = turns.slice(1);
      while (turns.length && turns[0].role !== "user") turns = turns.slice(1);
    }
    return turns;
  }

  async function streamReply(turns, signal, onText) {
    const cfg = state.cfg;
    let model = cfg.models[state.tier] || cfg.models.default;
    let res;
    try { res = await callAI(cfg, model, turns, signal); }
    catch (e) {
      if (e && e.name === "AbortError") throw e;
      throw new Error(cfg.id === "custom" ? "Couldn't reach that API address. Check it in AI settings, and make sure the service allows use from a browser." : "Couldn't reach " + cfg.label + ". Check your internet connection and try again.");
    }
    // If the chosen model isn't available (say, a paid model on a free plan), use the Balanced one.
    if (!res.ok && model !== cfg.models.default && [400, 403, 404, 429].includes(res.status)) {
      model = cfg.models.default;
      res = await callAI(cfg, model, turns, signal);
    }
    if (!res.ok) throw await errorFor(cfg, res, model);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "", text = "", truncated = false;
    const handle = (block) => {
      const data = block.split("\n").filter(l => l.startsWith("data:")).map(l => l.slice(5).trim()).join("");
      if (!data || data === "[DONE]") return;
      let ev; try { ev = JSON.parse(data); } catch (e) { return; }
      const out = readEvent(cfg, ev);
      if (!out) return;
      if (out.text) { text += out.text; onText(text); }
      if (out.truncated) truncated = true;
      if (out.error) { const err = new Error(out.error); err.partial = text; throw err; }
    };
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true }).replace(/\r\n/g, "\n");
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) { const block = buf.slice(0, i); buf = buf.slice(i + 2); handle(block); }
    }
    handle(buf);
    if (!text.trim()) throw new Error("The AI didn't write anything back. Try rephrasing.");
    return { text, truncated };
  }

  async function runReply(chatId) {
    const c = state.chats.get(chatId); if (!c) return;
    const ctl = new AbortController();
    state.streaming = { chatId, ctl };
    setSendMode(); renderThread();
    let node = null, body = null, latest = "";
    const mount = () => {
      if (state.currentId !== chatId) return null;
      if (!node || !node.isConnected) { node = aiNode("", { streaming: true }); thread.appendChild(node); body = node.querySelector(".md"); }
      return body;
    };
    mount(); toBottom();
    try {
      const res = await streamReply(buildTurns(c.messages), ctl.signal, (text) => {
        latest = text;
        const stick = nearBottom();
        const b = mount(); if (b) { b.innerHTML = renderMd(text); if (stick) toBottom(); }
      });
      c.messages.push({ role: "assistant", content: res.text, interrupted: res.truncated });
    } catch (e) {
      const cancelled = e && e.name === "AbortError";
      const partial = (e && e.partial) || latest;
      if (partial) c.messages.push({ role: "assistant", content: partial, interrupted: !cancelled });
      if (e && e.badKey) openSettings(e.message);
      if (!cancelled && !partial) state.lastError = { chatId, message: (e && e.message) || "Something went wrong. Try again." };
    } finally {
      state.streaming = null;
      c.updatedAt = Date.now();
      setSendMode(); renderList();
      if (state.currentId === chatId) { const stick = nearBottom(); renderThread(); if (stick) toBottom(); }
      saveLocal();
    }
  }

  // ---------- nav / events ----------
  function closeNav() { app.classList.remove("nav-open"); }
  $("menuBtn").onclick = () => app.classList.add("nav-open");
  $("scrim").onclick = closeNav;
  $("newChat").onclick = () => { newChat(); input.focus(); };

  document.querySelectorAll(".tiers button").forEach(b => {
    b.onclick = () => {
      state.tier = b.dataset.tier;
      document.querySelectorAll(".tiers button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      try { localStorage.setItem("lantern.tier", state.tier); } catch (e) {}
    };
  });
  try {
    const t = localStorage.getItem("lantern.tier");
    if (t) { const b = document.querySelector('.tiers button[data-tier="' + t + '"]'); if (b) b.click(); }
  } catch (e) {}

  $("composer").addEventListener("submit", (e) => {
    e.preventDefault();
    if (state.streaming) state.streaming.ctl.abort(); else send();
  });
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!state.streaming) send(); }
  });

  // ---------- boot ----------
  loadLocal();
  newChat();
  setSendMode();
  const startCfg = buildCfg(loadSaved());
  if (startCfg.error) openSettings(); else { applyCfg(startCfg); input.focus(); }
})();
</script>
</body>
</html>
