<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Browser games and a web proxy.">
<title>Lantern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
.hero { padding: 48px 0 32px; }
.hero h1 {
  margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(34px, 6vw, 56px);
  line-height: 1.05; letter-spacing: -.02em;
}
.hero p { margin: 12px 0 24px; color: var(--muted); font-size: 17px; max-width: 560px; }
.go {
  display: flex; gap: 8px; max-width: 640px; padding: 6px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
}
.go:focus-within { border-color: var(--accent); }
.go svg { flex: none; align-self: center; margin-left: 8px; color: var(--muted); }
.go input { flex: 1; min-width: 0; border: 0; background: none; padding: 8px 4px; font-size: 16px; outline: none; }
.go-note { margin-top: 10px; font-size: 13px; color: var(--muted); }

.section-head { display: flex; align-items: baseline; gap: 12px; margin: 24px 0 14px; flex-wrap: wrap; }
.section-head h2 { margin: 0; font-family: var(--f-display); font-size: 26px; letter-spacing: -.01em; }
.section-head .count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.filter {
  margin-left: auto; width: 220px; max-width: 100%; padding: 7px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface);
}
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; padding-bottom: 32px; }
.card {
  display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: 14px; text-decoration: none;
  background: var(--surface); border: 1px solid var(--line); transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card .art {
  height: 112px; margin-bottom: 10px; border-radius: 10px; background: var(--sunk);
  display: flex; align-items: center; justify-content: center;
}
.card h3 { margin: 0; font-family: var(--f-display); font-size: 19px; letter-spacing: -.01em; }
.card p { margin: 0; font-size: 14px; color: var(--muted); }
.card .meta { margin-top: auto; padding-top: 10px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.card .meta b { color: var(--accent); font-weight: 500; }
.empty { color: var(--muted); padding: 24px 0 48px; }
footer { border-top: 1px solid var(--line); padding: 20px 0 32px; font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
@media (max-width: 560px) {
  .hero { padding: 32px 0 24px; }
  .filter { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<header class="site-top">
  <a class="brand" href="./">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <rect x="9" y="1.5" width="8" height="3" rx="1.5" fill="var(--ink)"/>
      <path d="M6 7.5h14l-1.6 14.5a2 2 0 0 1-2 1.8H9.6a2 2 0 0 1-2-1.8L6 7.5z" fill="none" stroke="var(--ink)" stroke-width="2"/>
      <circle cx="13" cy="15" r="3.6" fill="var(--accent)"/>
    </svg>
    <b>Lantern</b>
  </a>
  <nav class="nav" aria-label="Site">
    <a href="./" aria-current="page">Games</a>
    <a href="proxy.html">Proxy</a>
  </nav>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Play something.</h1>
    <p>Eight games that run right in your browser, plus a proxy for getting to the rest of the web.</p>
    <form class="go" id="go" action="proxy.html" method="get">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m12.2 12.2 3.8 3.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input name="q" type="text" placeholder="Search the web or type an address" aria-label="Search or address" autocomplete="off" spellcheck="false" enterkeyhint="go">
      <button class="btn primary" type="submit">Go</button>
    </form>
    <div class="go-note">Opens in the proxy.</div>
  </section>

  <div class="section-head">
    <h2>Games</h2>
    <span class="count" id="count"></span>
    <input class="filter" id="filter" type="search" placeholder="Filter games" aria-label="Filter games">
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No games match that.</p>
</main>

<footer>
  <div class="wrap">Scores and progress are saved in this browser only.</div>
</footer>

<script>
(function () {
  const S = 'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"';
  const A = 'fill="var(--accent)"', I = 'fill="var(--ink)"', L = 'fill="var(--line)"';
  const GAMES = [
    { id: 'snake', name: 'Snake', text: 'Eat, grow longer, and don’t bite your own tail.', tags: 'arcade classic',
      art: `<rect x="6" y="22" width="9" height="9" rx="2.5" ${A}/><rect x="16" y="22" width="9" height="9" rx="2.5" ${A}/><rect x="26" y="22" width="9" height="9" rx="2.5" ${A}/><rect x="26" y="12" width="9" height="9" rx="2.5" ${A}/><rect x="36" y="12" width="9" height="9" rx="2.5" ${I}/><circle cx="60" cy="16.5" r="4" fill="var(--danger)"/>` },
    { id: '2048', name: '2048', text: 'Slide the tiles. Merge matching numbers until you reach 2048.', tags: 'puzzle numbers',
      art: `<rect x="14" y="4" width="18" height="18" rx="3" fill="color-mix(in srgb, var(--accent) 25%, var(--surface))"/><rect x="34" y="4" width="18" height="18" rx="3" fill="color-mix(in srgb, var(--accent) 55%, var(--surface))"/><rect x="14" y="24" width="18" height="18" rx="3" ${A}/><rect x="34" y="24" width="18" height="18" rx="3" ${I}/>` },
    { id: 'blocks', name: 'Blocks', text: 'Falling pieces, full rows, rising speed.', tags: 'puzzle arcade tetris',
      art: `<rect x="12" y="10" width="10" height="10" rx="2" fill="#9A6BC9"/><rect x="22" y="10" width="10" height="10" rx="2" fill="#9A6BC9"/><rect x="32" y="10" width="10" height="10" rx="2" fill="#9A6BC9"/><rect x="22" y="20" width="10" height="10" rx="2" fill="#9A6BC9"/><rect x="12" y="34" width="10" height="10" rx="2" fill="#3BA5C4"/><rect x="22" y="34" width="10" height="10" rx="2" fill="#3BA5C4"/><rect x="32" y="34" width="10" height="10" rx="2" fill="#D9A92E"/><rect x="42" y="34" width="10" height="10" rx="2" fill="#D9A92E"/><rect x="42" y="24" width="10" height="10" rx="2" fill="#D9A92E"/>` },
    { id: 'minesweeper', name: 'Minesweeper', text: 'Use the numbers to find every mine without setting one off.', tags: 'puzzle logic',
      art: `<path d="M22 40V8" ${S}/><path d="M22 9h16l-4 6 4 6H22z" ${A}/><circle cx="48" cy="32" r="7" ${I}/><path d="M48 21v22M37 32h22M40.5 24.5l15 15M55.5 24.5l-15 15" ${S}/>` },
    { id: 'breakout', name: 'Breakout', text: 'Bounce the ball and break every brick.', tags: 'arcade classic',
      art: `<rect x="6" y="6" width="16" height="6" rx="2" ${A}/><rect x="24" y="6" width="16" height="6" rx="2" ${A}/><rect x="42" y="6" width="16" height="6" rx="2" ${A}/><rect x="15" y="14" width="16" height="6" rx="2" fill="color-mix(in srgb, var(--accent) 55%, var(--surface))"/><rect x="33" y="14" width="16" height="6" rx="2" fill="color-mix(in srgb, var(--accent) 55%, var(--surface))"/><circle cx="38" cy="32" r="3.5" ${A}/><rect x="22" y="41" width="22" height="4" rx="2" ${I}/>` },
    { id: 'flap', name: 'Flap', text: 'Tap to fly through the gaps. One touch and it’s over.', tags: 'arcade one-button',
      art: `<rect x="40" y="0" width="12" height="16" ${L}/><rect x="40" y="32" width="12" height="16" ${L}/><circle cx="22" cy="24" r="7" ${A}/><rect x="18.5" y="14.5" width="7" height="3" rx="1.5" ${I}/><circle cx="25" cy="22" r="1.6" ${I}/>` },
    { id: 'pong', name: 'Pong', text: 'Table tennis against the computer. First to seven.', tags: 'arcade classic sports',
      art: `<rect x="8" y="10" width="4" height="16" rx="2" ${A}/><rect x="52" y="22" width="4" height="16" rx="2" ${I}/><circle cx="34" cy="20" r="3.5" ${I}/><path d="M32 4v4M32 14v4M32 24v4M32 34v4M32 44v2" stroke="var(--line)" stroke-width="2"/>` },
    { id: 'connect4', name: 'Connect Four', text: 'Drop discs and line up four. Play the computer or a friend.', tags: 'strategy two-player board',
      art: `<rect x="12" y="6" width="40" height="36" rx="5" fill="var(--surface)"/>${[0, 1, 2, 3].map((c) => [0, 1, 2].map((r) => `<circle cx="${19 + c * 9}" cy="${14 + r * 10}" r="3.6" fill="${(r === 2 && c < 3) || (r === 1 && c === 1) ? 'var(--accent)' : (r === 2 && c === 3) || (r === 1 && c === 2) ? 'var(--ink)' : 'var(--sunk)'}"/>`).join('')).join('')}` },
  ];

  function saved(id) {
    try { return JSON.parse(localStorage.getItem('lantern.games.' + id + '.card')); } catch { return null; }
  }

  const grid = document.getElementById('grid');
  for (const g of GAMES) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = 'games/' + g.id + '.html';
    a.dataset.search = (g.name + ' ' + g.tags).toLowerCase();
    const note = saved(g.id);
    a.innerHTML = `<div class="art"><svg width="128" height="96" viewBox="0 0 64 48" aria-hidden="true">${g.art}</svg></div>
      <h3></h3><p></p><div class="meta">${note ? '<b></b>' : 'Not played yet'}</div>`;
    a.querySelector('h3').textContent = g.name;
    a.querySelector('p').textContent = g.text;
    if (note) a.querySelector('.meta b').textContent = note;
    grid.appendChild(a);
  }

  const count = document.getElementById('count');
  const empty = document.getElementById('empty');
  const filter = document.getElementById('filter');
  function applyFilter() {
    const q = filter.value.trim().toLowerCase();
    let shown = 0;
    for (const card of grid.children) {
      const match = !q || card.dataset.search.includes(q);
      card.hidden = !match;
      if (match) shown++;
    }
    count.textContent = q ? shown + ' of ' + GAMES.length : GAMES.length + ' games';
    empty.hidden = shown > 0;
  }
  filter.addEventListener('input', applyFilter);
  applyFilter();

  document.getElementById('go').addEventListener('submit', (e) => {
    if (!e.target.q.value.trim()) e.preventDefault();
  });
})();
</script>
</body>
</html>
