<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Snake</title>
<link rel="stylesheet" href="shell.css" />
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span class="pill">Score <b id="score">0</b></span>
    <span class="pill">Best <b id="best">0</b></span>
  </div>
  <canvas id="c" width="400" height="400"></canvas>
  <div class="msg" id="msg">Arrow keys / WASD to move. Swipe on touch.</div>
  <div class="btns"><button class="g" id="new">New game</button></div>
</div>
<script src="shell.js"></script>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
const N = 20, S = c.width / N;
let snake, dir, nextDir, food, score, best = +(localStorage.getItem('orbit_snake_best') || 0), dead, acc, speed;
document.getElementById('best').textContent = best;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = dir; score = 0; dead = false; acc = 0; speed = 8;
  placeFood(); document.getElementById('score').textContent = 0;
  document.getElementById('msg').textContent = 'Arrow keys / WASD to move. Swipe on touch.';
}
function placeFood() {
  do { food = {x: (Math.random()*N)|0, y:(Math.random()*N)|0}; }
  while (snake.some(s => s.x===food.x && s.y===food.y));
}
function setDir(nx, ny) { if (nx === -dir.x && ny === -dir.y) return; nextDir = {x:nx, y:ny}; }
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k==='arrowup'||k==='w') setDir(0,-1);
  else if (k==='arrowdown'||k==='s') setDir(0,1);
  else if (k==='arrowleft'||k==='a') setDir(-1,0);
  else if (k==='arrowright'||k==='d') setDir(1,0);
  if (['arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
});
let ts = null;
c.addEventListener('touchstart', e => { ts = e.touches[0]; }, {passive:true});
c.addEventListener('touchmove', e => {
  if (!ts) return; const t = e.touches[0]; const dx = t.clientX-ts.clientX, dy = t.clientY-ts.clientY;
  if (Math.abs(dx)+Math.abs(dy) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx>0?1:-1,0); else setDir(0,dy>0?1:-1); ts = null; e.preventDefault();
}, {passive:false});

function step(dt) {
  if (dead) return;
  acc += dt/1000;
  if (acc < 1/speed) return; acc = 0;
  dir = nextDir;
  const head = {x: snake[0].x+dir.x, y: snake[0].y+dir.y};
  if (head.x<0||head.y<0||head.x>=N||head.y>=N || snake.some(s=>s.x===head.x&&s.y===head.y)) {
    dead = true; best = Math.max(best, score); localStorage.setItem('orbit_snake_best', best);
    document.getElementById('best').textContent = best;
    document.getElementById('msg').textContent = 'Game over — press New game.'; Orbit.beep(120,0.2,'sawtooth'); return;
  }
  snake.unshift(head);
  if (head.x===food.x && head.y===food.y) { score++; document.getElementById('score').textContent = score; placeFood(); Orbit.beep(660,0.06); if (score%5===0) speed += 0.6; }
  else snake.pop();
}
function draw() {
  x.fillStyle = '#0e0e15'; x.fillRect(0,0,c.width,c.height);
  x.fillStyle = '#f43f5e'; x.fillRect(food.x*S+2, food.y*S+2, S-4, S-4);
  for (let i=0;i<snake.length;i++){ x.fillStyle = i===0 ? '#c4b5fd' : '#8b5cf6'; x.fillRect(snake[i].x*S+1, snake[i].y*S+1, S-2, S-2); }
}
document.getElementById('new').onclick = reset;
reset();
Orbit.loop((dt) => { step(dt); draw(); });
</script>
</body>
</html>
