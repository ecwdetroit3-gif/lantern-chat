<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Whack-a-Mole</title>
<link rel="stylesheet" href="shell.css" />
<style>
  #b{display:grid;grid-template-columns:repeat(3,96px);gap:12px;}
  .hole{width:96px;height:96px;border-radius:50%;background:#14141c;border:2px solid #262636;display:grid;place-items:center;font-size:48px;cursor:pointer;overflow:hidden;}
  .hole .m{transform:translateY(120%);transition:transform .12s;}
  .hole.up .m{transform:translateY(0);}
  @media(max-width:420px){#b{grid-template-columns:repeat(3,84px);}.hole{width:84px;height:84px;font-size:42px;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span class="pill">Score <b id="score">0</b></span><span class="pill">Time <b id="time">30</b></span><span class="pill">Best <b id="best">0</b></span></div>
  <div id="b"></div>
  <div class="msg" id="msg">Press Start, then bop the moles!</div>
  <div class="btns"><button class="g" id="start">Start</button></div>
</div>
<script src="shell.js"></script>
<script>
const bEl=document.getElementById('b'); let holes=[],score,time,running,popT,tickT,best=+(localStorage.getItem('orbit_whack_best')||0);
document.getElementById('best').textContent=best;
for(let i=0;i<9;i++){ const h=document.createElement('div'); h.className='hole'; h.innerHTML='<span class="m">🐹</span>'; h.onclick=()=>hit(i); bEl.appendChild(h); holes.push(h); }
function hit(i){ if(!running||!holes[i].classList.contains('up'))return; holes[i].classList.remove('up'); score++; document.getElementById('score').textContent=score; Orbit.beep(700,0.05); }
function pop(){ if(!running)return; holes.forEach(h=>h.classList.remove('up')); const n=1+((Math.random()*2)|0); for(let k=0;k<n;k++)holes[(Math.random()*9)|0].classList.add('up'); popT=setTimeout(pop,Math.max(450,900-(30-time)*18)); }
function start(){ if(running)return; score=0;time=30;running=true; document.getElementById('score').textContent=0; document.getElementById('time').textContent=30; document.getElementById('msg').textContent='Go!';
  pop(); tickT=setInterval(()=>{ if(Orbit.paused)return; time--; document.getElementById('time').textContent=time; if(time<=0)end(); },1000); }
function end(){ running=false; clearTimeout(popT); clearInterval(tickT); holes.forEach(h=>h.classList.remove('up')); best=Math.max(best,score); localStorage.setItem('orbit_whack_best',best); document.getElementById('best').textContent=best; document.getElementById('msg').textContent='Time! You scored '+score+'.'; }
document.getElementById('start').onclick=start;
</script>
</body>
</html>
