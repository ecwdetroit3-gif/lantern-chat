<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>2048</title>
<link rel="stylesheet" href="shell.css" />
</head>
<body>
<div class="wrap">
  <div class="hud"><span class="pill">Score <b id="score">0</b></span><span class="pill">Best <b id="best">0</b></span></div>
  <canvas id="c" width="360" height="360"></canvas>
  <div class="msg" id="msg">Arrow keys or swipe to merge tiles.</div>
  <div class="btns"><button class="g" id="new">New game</button></div>
</div>
<script src="shell.js"></script>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const N=4,PAD=10,CELL=(c.width-PAD*(N+1))/N;
let grid,score,best=+(localStorage.getItem('orbit_2048_best')||0),won;
document.getElementById('best').textContent=best;
const COLORS={0:'#1a1a24',2:'#30303e',4:'#3b3550',8:'#6d4bb0',16:'#8257d6',32:'#a855f7',64:'#c084fc',128:'#f59e0b',256:'#f6a93b',512:'#f97316',1024:'#f43f5e',2048:'#22c55e'};
function reset(){ grid=Array.from({length:N},()=>Array(N).fill(0)); score=0; won=false; add(); add(); upd(); draw(); document.getElementById('msg').textContent='Arrow keys or swipe to merge tiles.'; }
function add(){ const empty=[]; for(let r=0;r<N;r++)for(let col=0;col<N;col++)if(!grid[r][col])empty.push([r,col]); if(!empty.length)return; const [r,col]=empty[(Math.random()*empty.length)|0]; grid[r][col]=Math.random()<0.9?2:4; }
function upd(){ document.getElementById('score').textContent=score; best=Math.max(best,score); localStorage.setItem('orbit_2048_best',best); document.getElementById('best').textContent=best; }
function slide(row){ let a=row.filter(v=>v); for(let i=0;i<a.length-1;i++){ if(a[i]===a[i+1]){ a[i]*=2; score+=a[i]; if(a[i]===2048)won=true; a.splice(i+1,1); } } while(a.length<N)a.push(0); return a; }
function rotate(g){ const r=Array.from({length:N},()=>Array(N).fill(0)); for(let i=0;i<N;i++)for(let j=0;j<N;j++)r[j][N-1-i]=g[i][j]; return r; }
function move(dir){ // 0 left,1 up,2 right,3 down
  let g=grid.map(r=>r.slice()); for(let i=0;i<dir;i++)g=rotate(g);
  const before=JSON.stringify(g); g=g.map(slide); if(JSON.stringify(g)!==before){ for(let i=0;i<(4-dir)%4;i++)g=rotate(g); grid=g; add(); upd(); Orbit.beep(440,0.03); if(won){document.getElementById('msg').textContent='You made 2048! Keep going.'; won=false;} if(!canMove())document.getElementById('msg').textContent='No moves left — New game.'; }
  draw();
}
function canMove(){ for(let r=0;r<N;r++)for(let col=0;col<N;col++){ if(!grid[r][col])return true; if(col<N-1&&grid[r][col]===grid[r][col+1])return true; if(r<N-1&&grid[r][col]===grid[r+1][col])return true; } return false; }
addEventListener('keydown',e=>{ const m={ArrowLeft:0,ArrowUp:1,ArrowRight:2,ArrowDown:3}; if(e.key in m){ move(m[e.key]); e.preventDefault(); } });
let ts=null; c.addEventListener('touchstart',e=>{ts=e.touches[0];},{passive:true});
c.addEventListener('touchend',e=>{ if(!ts)return; const t=e.changedTouches[0], dx=t.clientX-ts.clientX, dy=t.clientY-ts.clientY; if(Math.abs(dx)+Math.abs(dy)<24)return; if(Math.abs(dx)>Math.abs(dy))move(dx>0?2:0); else move(dy>0?3:1); ts=null; });
function draw(){ x.fillStyle='#0e0e15';x.fillRect(0,0,c.width,c.height);
  for(let r=0;r<N;r++)for(let col=0;col<N;col++){ const v=grid[r][col]; const px=PAD+col*(CELL+PAD),py=PAD+r*(CELL+PAD); x.fillStyle=COLORS[v]||'#22c55e'; roundRect(px,py,CELL,CELL,8); x.fill(); if(v){ x.fillStyle=v<=4?'#cfcee0':'#fff'; x.font='bold '+(v<100?30:v<1000?26:22)+'px Inter,sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(v,px+CELL/2,py+CELL/2); } }
}
function roundRect(px,py,w,h,r){ x.beginPath(); x.moveTo(px+r,py); x.arcTo(px+w,py,px+w,py+h,r); x.arcTo(px+w,py+h,px,py+h,r); x.arcTo(px,py+h,px,py,r); x.arcTo(px,py,px+w,py,r); x.closePath(); }
document.getElementById('new').onclick=reset;
reset();
</script>
</body>
</html>
