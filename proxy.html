<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Proxy · Lantern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
html, body { height: 100%; }
body { display: flex; flex-direction: column; overflow: hidden; }
.bar {
  display: flex; align-items: center; gap: 4px; flex: none;
  padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface);
}
.address {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; margin: 0 6px;
  padding: 0 6px 0 12px; height: 38px; border-radius: 10px; background: var(--sunk); border: 1px solid transparent;
}
.address:focus-within { border-color: var(--accent); background: var(--surface); }
.address input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 15px; }
.address svg { flex: none; color: var(--muted); }
.view { position: relative; flex: 1; min-height: 0; background: var(--surface); }
.view iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
.loading { position: absolute; left: 0; top: 0; height: 2px; width: 0; background: var(--accent); z-index: 2; }
.loading.on { width: 85%; transition: width 8s cubic-bezier(.1, .7, .2, 1); }
.loading.done { width: 100%; opacity: 0; transition: width .2s, opacity .3s .2s; }

.start { position: absolute; inset: 0; overflow-y: auto; background: var(--bg); }
.start-inner { max-width: 640px; margin: 0 auto; padding: 56px 16px 32px; }
.start h1 { margin: 0 0 8px; font-family: var(--f-display); font-size: clamp(30px, 5vw, 44px); letter-spacing: -.02em; line-height: 1.1; }
.start p { margin: 0 0 20px; color: var(--muted); }
.quick { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
.quick button { border-radius: 999px; }
.status {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line); font-size: 14px;
}
.status .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; background: var(--muted); }
.status[data-state="ready"] .dot { background: var(--good); }
.status[data-state="error"] { border-color: var(--danger); }
.status[data-state="error"] .dot { background: var(--danger); }
.status[data-state="working"] .dot { background: var(--accent); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.note { margin-top: 16px; font-size: 13px; color: var(--muted); }

dialog {
  width: min(460px, calc(100% - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 16px;
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(0, 0, 0, .35); }
dialog form { display: flex; flex-direction: column; gap: 16px; padding: 22px; }
dialog h2 { margin: 0; font-family: var(--f-display); font-size: 22px; }
dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
dialog .row .left { margin-right: auto; }
@media (max-width: 560px) {
  .bar { padding: 6px 8px; gap: 0; }
  .bar .hide-sm { display: none; }
  .address { margin: 0 4px; padding-left: 10px; }
  .start-inner { padding-top: 32px; }
}
@media (prefers-reduced-motion: reduce) { .loading { transition: none; } .status[data-state="working"] .dot { animation: none; } }
</style>
</head>
<body>
<header class="site-top">
  <a class="brand" href="./">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <rect x="9" y="1.5" width="8" height="3" rx="1.5" fill="var(--ink)"/>
      <path d="M6 7.5h14l-1.6 14.5a2 2 0 0 1-2 1.8H9.6a2 2 0 0 1-2-1.8L6 7.5z" fill="none" stroke="var(--ink)" stroke-width="2"/>
      <circle cx="13" cy="15" r="3.6" fill="var(--accent)"/>
    </svg>
    <b>Lantern</b>
  </a>
  <nav class="nav" aria-label="Site">
    <a href="./">Games</a>
    <a href="proxy.html" aria-current="page">Proxy</a>
  </nav>
</header>

<div class="bar">
  <button class="icon-btn" id="back" type="button" aria-label="Back" title="Back" disabled><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 4 6 9l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="icon-btn hide-sm" id="forward" type="button" aria-label="Forward" title="Forward" disabled><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="m7 4 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="icon-btn" id="reload" type="button" aria-label="Reload" title="Reload" disabled><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M14.5 9a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <form class="address" id="addressForm">
    <svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m12.2 12.2 3.8 3.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input id="address" type="text" placeholder="Search or type a web address" aria-label="Search or address" autocomplete="off" spellcheck="false" enterkeyhint="go">
  </form>
  <button class="icon-btn" id="home" type="button" aria-label="Proxy start page" title="Start page"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 8.5 9 3l6 5.5V15a1 1 0 0 1-1 1h-3v-4H7v4H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button>
  <button class="icon-btn hide-sm" id="popout" type="button" aria-label="Open in a new tab" title="Open in a new tab" disabled><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M10 3h5v5M15 3l-7 7M13 11v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="icon-btn hide-sm" id="fullscreen" type="button" aria-label="Full screen" title="Full screen" disabled><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 7V3h4M15 7V3h-4M3 11v4h4M15 11v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="icon-btn" id="settingsBtn" type="button" aria-label="Proxy settings" title="Settings"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9 1.8v2.1M9 14.1v2.1M1.8 9h2.1M14.1 9h2.1M3.9 3.9l1.5 1.5M12.6 12.6l1.5 1.5M3.9 14.1l1.5-1.5M12.6 5.4l1.5-1.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
</div>

<main class="view">
  <div class="loading" id="loading"></div>
  <iframe id="frame" title="Proxied page" hidden allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture; gamepad"></iframe>
  <section class="start" id="start">
    <div class="start-inner">
      <h1>Where to?</h1>
      <p>Type an address or a search in the bar above. Pages load through the proxy, inside this tab.</p>
      <div class="quick" id="quick">
        <button class="btn" type="button" data-url="https://duckduckgo.com/">DuckDuckGo</button>
        <button class="btn" type="button" data-url="https://www.wikipedia.org/">Wikipedia</button>
        <button class="btn" type="button" data-url="https://www.youtube.com/">YouTube</button>
        <button class="btn" type="button" data-url="https://www.reddit.com/">Reddit</button>
        <button class="btn" type="button" data-url="https://github.com/">GitHub</button>
      </div>
      <div class="status" id="status" data-state="working"><span class="dot"></span><span id="statusText">Starting the proxy…</span></div>
      <p class="note">Sites you open here run on this website's address. Don't sign in to accounts you care about through the proxy.</p>
    </div>
  </section>
</main>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h2>Proxy settings</h2>
    <label class="field">Wisp server
      <input id="wispInput" type="url" spellcheck="false" placeholder="wss://example.com/wisp/" required>
      <small>The proxy needs a Wisp server to reach other sites, because GitHub Pages can't run one. Use a public one or host your own.</small>
    </label>
    <label class="field">Search with
      <select id="engineInput">
        <option value="https://duckduckgo.com/?q=%s">DuckDuckGo</option>
        <option value="https://www.google.com/search?q=%s">Google</option>
        <option value="https://www.bing.com/search?q=%s">Bing</option>
        <option value="https://search.brave.com/search?q=%s">Brave Search</option>
      </select>
    </label>
    <div class="row">
      <button class="btn left" type="button" id="resetSettings">Use defaults</button>
      <button class="btn" type="button" id="cancelSettings">Cancel</button>
      <button class="btn primary" type="submit" value="save">Save</button>
    </div>
  </form>
</dialog>

<script src="baremux/index.js"></script>
<script src="uv/uv.bundle.js"></script>
<script src="uv/uv.config.js"></script>
<script>
/* global BareMux, __uv$config */
(function () {
  const DEFAULTS = { wisp: 'wss://wisp.mercurywork.shop/', engine: 'https://duckduckgo.com/?q=%s' };
  const SITE = new URL('./', location.href);
  const $ = (id) => document.getElementById(id);
  const frame = $('frame'), start = $('start'), address = $('address'), loading = $('loading');
  const statusEl = $('status'), statusText = $('statusText');

  function loadSettings() {
    try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem('lantern.proxy') || '{}') }; } catch { return { ...DEFAULTS }; }
  }
  function saveSettings(s) {
    try { localStorage.setItem('lantern.proxy', JSON.stringify(s)); } catch { /* settings last for this visit only */ }
  }
  let settings = loadSettings();

  function setStatus(state, text) {
    statusEl.dataset.state = state;
    statusText.textContent = text;
  }

  // Registers the service worker that rewrites pages and points it at the Wisp server.
  let ready = null;
  function setup() {
    ready = (async () => {
      if (!window.isSecureContext) throw new Error('The proxy only works over https (or on localhost).');
      if (!('serviceWorker' in navigator)) throw new Error('This browser can’t run the proxy: service workers are off. Private windows in some browsers turn them off.');
      if (typeof SharedWorker === 'undefined') throw new Error('This browser can’t run the proxy: it doesn’t support shared workers. Try Chrome, Edge or Firefox on a computer.');
      const reg = await navigator.serviceWorker.register(new URL('uv/sw.js', SITE), { scope: new URL('uv/', SITE).pathname });
      await activated(reg);
      const conn = new BareMux.BareMuxConnection(new URL('baremux/worker.js', SITE).href);
      await conn.setTransport(new URL('epoxy/index.mjs', SITE).href, [{ wisp: settings.wisp }]);
      await probe(settings.wisp);
    })();
    ready.then(
      () => setStatus('ready', 'Proxy ready · ' + new URL(settings.wisp).host),
      (err) => setStatus('error', err.message || String(err)),
    );
    return ready;
  }

  // Checks that the Wisp server answers, so a dead server shows up here instead of as a blank page.
  function probe(url) {
    return new Promise((resolve, reject) => {
      const host = new URL(url).host;
      let ws, timer;
      const fail = () => { clearTimeout(timer); reject(new Error('Can\u2019t reach the Wisp server at ' + host + '. It may be down or blocked on this network. Pick another one in settings.')); };
      try { ws = new WebSocket(url); } catch { fail(); return; }
      timer = setTimeout(() => { ws.close(); fail(); }, 8000);
      ws.onopen = () => { clearTimeout(timer); ws.close(); resolve(); };
      ws.onerror = fail;
    });
  }

  function activated(reg) {
    if (reg.active) return Promise.resolve();
    const sw = reg.installing || reg.waiting;
    return new Promise((resolve, reject) => {
      sw.addEventListener('statechange', () => {
        if (sw.state === 'activated') resolve();
        if (sw.state === 'redundant') reject(new Error('The proxy’s service worker failed to install.'));
      });
    });
  }

  function toUrl(input) {
    const text = input.trim();
    if (/^https?:\/\//i.test(text)) return text;
    if (/^(localhost|\d{1,3}(\.\d{1,3}){3})(:\d+)?(\/\S*)?$/i.test(text)) return 'http://' + text;
    if (!/\s/.test(text) && /^[^/\s]+\.[a-z]{2,}(:\d+)?(\/\S*)?$/i.test(text)) return 'https://' + text;
    return settings.engine.replace('%s', encodeURIComponent(text));
  }

  function proxied(url) { return __uv$config.prefix + __uv$config.encodeUrl(url); }

  // Reads the real address of whatever page the frame is showing.
  function currentUrl() {
    try {
      const p = frame.contentWindow.location.pathname + frame.contentWindow.location.search;
      if (!p.startsWith(__uv$config.prefix)) return null;
      return __uv$config.decodeUrl(p.slice(__uv$config.prefix.length));
    } catch { return null; }
  }

  async function go(input) {
    if (!input.trim()) return;
    const url = toUrl(input);
    address.value = url;
    address.blur();
    try {
      await ready;
    } catch {
      showStart();
      return;
    }
    start.hidden = true;
    frame.hidden = false;
    ['back', 'forward', 'reload', 'popout', 'fullscreen'].forEach((id) => { $(id).disabled = false; });
    loading.className = 'loading';
    requestAnimationFrame(() => { loading.className = 'loading on'; });
    frame.src = proxied(url);
    history.replaceState(null, '', '?url=' + encodeURIComponent(url));
  }

  function showStart() {
    frame.hidden = true;
    frame.removeAttribute('src');
    start.hidden = false;
    address.value = '';
    document.title = 'Proxy · Lantern';
    ['back', 'forward', 'reload', 'popout', 'fullscreen'].forEach((id) => { $(id).disabled = true; });
    history.replaceState(null, '', location.pathname);
  }

  frame.addEventListener('load', () => {
    loading.className = 'loading done';
    const url = currentUrl();
    if (!url) return;
    if (document.activeElement !== address) address.value = url;
    history.replaceState(null, '', '?url=' + encodeURIComponent(url));
    try {
      const t = frame.contentDocument && frame.contentDocument.title;
      document.title = (t ? t + ' · ' : '') + 'Proxy · Lantern';
    } catch { /* cross-origin page: keep the old title */ }
  });

  $('addressForm').addEventListener('submit', (e) => { e.preventDefault(); go(address.value); });
  $('quick').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) go(b.dataset.url); });
  $('back').addEventListener('click', () => { try { frame.contentWindow.history.back(); } catch { /* not loaded */ } });
  $('forward').addEventListener('click', () => { try { frame.contentWindow.history.forward(); } catch { /* not loaded */ } });
  $('reload').addEventListener('click', () => {
    try { frame.contentWindow.location.reload(); } catch { frame.src = frame.src; }
  });
  $('home').addEventListener('click', showStart);
  $('popout').addEventListener('click', () => {
    const url = currentUrl();
    if (url) window.open(proxied(url), '_blank', 'noopener');
  });
  $('fullscreen').addEventListener('click', () => { if (frame.requestFullscreen) frame.requestFullscreen().catch(() => {}); });

  // Settings
  const dlg = $('settings');
  $('settingsBtn').addEventListener('click', () => {
    $('wispInput').value = settings.wisp;
    $('engineInput').value = settings.engine;
    dlg.showModal();
  });
  $('cancelSettings').addEventListener('click', () => dlg.close());
  $('resetSettings').addEventListener('click', () => {
    $('wispInput').value = DEFAULTS.wisp;
    $('engineInput').value = DEFAULTS.engine;
  });
  $('settingsForm').addEventListener('submit', (e) => {
    const wisp = $('wispInput').value.trim();
    if (!/^wss?:\/\//i.test(wisp)) {
      e.preventDefault();
      $('wispInput').setCustomValidity('Wisp addresses start with wss:// or ws://');
      $('wispInput').reportValidity();
      return;
    }
    settings = { wisp, engine: $('engineInput').value };
    saveSettings(settings);
    setStatus('working', 'Reconnecting…');
    setup().then(() => { if (!frame.hidden) $('reload').click(); }, () => {});
  });
  $('wispInput').addEventListener('input', (e) => e.target.setCustomValidity(''));

  setup();
  const params = new URLSearchParams(location.search);
  const first = params.get('url') || params.get('q');
  if (first) go(first);
})();
</script>
</body>
</html>
