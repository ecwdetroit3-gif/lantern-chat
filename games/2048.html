<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2048 · Lantern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="shell.css">
<style>
.board {
  position: relative; width: min(100cqw, 100cqh, 520px); aspect-ratio: 1; padding: 2.4%;
  border-radius: 14px; background: var(--sunk); touch-action: none; user-select: none; -webkit-user-select: none;
}
.stage { container-type: size; }
.cells, .tiles { position: absolute; inset: 2.4%; }
.cells { display: grid; grid-template: repeat(4, 1fr) / repeat(4, 1fr); gap: 3.2%; }
.cells div { border-radius: 8px; background: color-mix(in srgb, var(--surface) 55%, var(--sunk)); }
.tile {
  position: absolute; width: 22.6%; height: 22.6%; display: flex; align-items: center; justify-content: center;
  border-radius: 8px; font-family: var(--f-display); font-weight: 700; font-variant-numeric: tabular-nums;
  font-size: clamp(16px, 6.5cqmin, 44px); transition: transform 110ms ease-in-out; will-change: transform;
}
.tile.big { font-size: clamp(14px, 5cqmin, 34px); }
.tile.huge { font-size: clamp(12px, 4cqmin, 28px); }
.tile.new { animation: pop-in 160ms ease-out 90ms backwards; }
.tile.merged { animation: pop 180ms ease-out 100ms backwards; z-index: 1; }
@keyframes pop-in { from { transform: var(--pos) scale(0); } to { transform: var(--pos) scale(1); } }
@keyframes pop {
  from { opacity: 0; transform: var(--pos) scale(.8); }
  60% { opacity: 1; transform: var(--pos) scale(1.12); }
  to { transform: var(--pos) scale(1); }
}
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } .tile.new, .tile.merged { animation: none; } }
</style>
</head>
<body>
<header class="game-top">
  <a class="icon-btn" href="../" aria-label="All games" title="All games"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 4 6 9l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <h1>2048</h1>
  <div class="stats">
    <div class="stat"><span>Score</span><b id="score">0</b></div>
    <div class="stat"><span>Best</span><b id="best">0</b></div>
  </div>
  <button class="icon-btn" id="undo" type="button" aria-label="Undo" title="Undo (U)" disabled><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M6 4 2.5 7.5 6 11M3 7.5h7.5a4.5 4.5 0 0 1 0 9H8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="icon-btn" id="restart" type="button" aria-label="New game" title="New game (R)"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M14.5 9a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="icon-btn hide-sm" id="fullscreen" type="button" aria-label="Full screen" title="Full screen"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 7V3h4M15 7V3h-4M3 11v4h4M15 11v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</header>
<main class="stage">
  <div class="board" id="board" aria-label="2048 board">
    <div class="cells"></div>
    <div class="tiles" id="tiles"></div>
  </div>
</main>
<p class="help"><span class="keys"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>WASD</kbd> to slide · <kbd>U</kbd> to undo · </span>Swipe on touch screens. Matching tiles merge — reach 2048.</p>
<script src="shell.js"></script>
<script>
(function () {
  const N = 4;
  const tilesEl = document.getElementById('tiles');
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const undoBtn = document.getElementById('undo');
  document.querySelector('.cells').innerHTML = '<div></div>'.repeat(N * N);

  // Tile colors climb an amber ramp from the surface color to full accent, then go dark.
  function tileStyle(v) {
    const c = Shell.colors;
    const step = Math.log2(v);
    if (step <= 10) {
      const pct = Math.round(8 + (step - 1) * 9.2);
      return { bg: `color-mix(in srgb, ${c.accent} ${pct}%, ${c.surface})`, fg: step >= 6 ? c['accent-ink'] : c.ink };
    }
    return { bg: c.ink, fg: c.bg };
  }

  let grid, score, nextId, won, keepGoing, history, moving;
  let tileEls = new Map();
  bestEl.textContent = Shell.fmt(Shell.get('2048.best', 0));

  function emptyGrid() { return Array.from({ length: N }, () => Array(N).fill(null)); }

  function addRandom() {
    const free = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) free.push([r, c]);
    if (!free.length) return;
    const [r, c] = free[Math.floor(Math.random() * free.length)];
    grid[r][c] = { id: nextId++, v: Math.random() < 0.9 ? 2 : 4, isNew: true };
  }

  function newGame() {
    grid = emptyGrid(); score = 0; nextId = 1; won = false; keepGoing = false; history = [];
    tilesEl.textContent = ''; tileEls = new Map();
    addRandom(); addRandom();
    Shell.set('2048.state', null);
    Shell.hideOverlay();
    render();
  }

  function snapshot() {
    return { grid: grid.map((row) => row.map((t) => (t ? { id: t.id, v: t.v } : null))), score, won, keepGoing };
  }

  function save() { Shell.set('2048.state', { ...snapshot(), nextId }); }

  function load(state) {
    grid = state.grid; score = state.score; won = state.won; keepGoing = state.keepGoing;
    nextId = state.nextId || 1000;
    for (const row of grid) for (const t of row) if (t && t.id >= nextId) nextId = t.id + 1;
  }

  function move(dir) {
    if (moving || Shell.overlayOpen()) return;
    const before = snapshot();
    const vec = { left: [0, -1], right: [0, 1], up: [-1, 0], down: [1, 0] }[dir];
    const order = [...Array(N).keys()];
    const rows = vec[0] === 1 ? order.slice().reverse() : order;
    const cols = vec[1] === 1 ? order.slice().reverse() : order;
    const next = emptyGrid();
    const merged = emptyGrid();
    const ghosts = []; // tiles that slide into a merge and then disappear
    let moved = false, gained = 0;

    for (const r of rows) for (const c of cols) {
      const t = grid[r][c];
      if (!t) continue;
      let nr = r, nc = c;
      while (true) {
        const tr = nr + vec[0], tc = nc + vec[1];
        if (tr < 0 || tc < 0 || tr >= N || tc >= N) break;
        const other = next[tr][tc];
        if (!other) { nr = tr; nc = tc; continue; }
        if (other.v === t.v && !merged[tr][tc]) {
          const m = { id: nextId++, v: t.v * 2, merged: true };
          ghosts.push({ id: other.id, r: tr, c: tc }, { id: t.id, r: tr, c: tc });
          next[tr][tc] = m; merged[tr][tc] = true; gained += m.v;
          nr = -1;
        }
        break;
      }
      if (nr === -1) { moved = true; continue; }
      next[nr][nc] = { id: t.id, v: t.v };
      if (nr !== r || nc !== c) moved = true;
    }
    if (!moved) return;

    history.push(before);
    if (history.length > 20) history.shift();
    grid = next; score += gained;
    for (const row of grid) for (const t of row) if (t) t.isNew = false;
    addRandom();
    moving = true;
    render(ghosts);
    setTimeout(() => { moving = false; afterMove(); }, 120);
  }

  function afterMove() {
    const { best } = Shell.best('2048', score);
    bestEl.textContent = Shell.fmt(best);
    Shell.card('2048', 'Best ' + Shell.fmt(best));
    save();
    if (!won && grid.some((row) => row.some((t) => t && t.v >= 2048))) {
      won = true; save();
      Shell.overlay('You made 2048', 'Score ' + Shell.fmt(score), [
        { label: 'Keep going', primary: true, onClick: () => { keepGoing = true; Shell.hideOverlay(); save(); } },
        { label: 'New game', onClick: newGame },
      ]);
    } else if (!canMove()) {
      Shell.set('2048.state', null);
      Shell.overlay('No moves left', 'Score ' + Shell.fmt(score), [
        { label: 'New game', primary: true, onClick: newGame },
        { label: 'Undo', onClick: () => { Shell.hideOverlay(); undo(); } },
      ]);
    }
  }

  function canMove() {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const t = grid[r][c];
      if (!t) return true;
      if (c + 1 < N && grid[r][c + 1] && grid[r][c + 1].v === t.v) return true;
      if (r + 1 < N && grid[r + 1][c] && grid[r + 1][c].v === t.v) return true;
    }
    return false;
  }

  function undo() {
    if (moving || !history.length) return;
    load(history.pop());
    tilesEl.textContent = ''; tileEls = new Map();
    save();
    render();
  }

  // Each step is one tile plus one gap: (22.6% + 3.2%) / 22.6% of the tile's own size.
  function pos(r, c) { return `translate(${c * 114.16}%, ${r * 114.16}%)`; }

  function render(ghosts) {
    const seen = new Set();
    (ghosts || []).forEach((g) => {
      const el = tileEls.get(g.id);
      if (!el) return;
      el.style.setProperty('--pos', pos(g.r, g.c));
      el.style.transform = pos(g.r, g.c);
      el.style.zIndex = 0;
      tileEls.delete(g.id);
      setTimeout(() => el.remove(), 120);
    });
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const t = grid[r][c];
      if (!t) continue;
      seen.add(t.id);
      let el = tileEls.get(t.id);
      const p = pos(r, c);
      if (!el) {
        el = document.createElement('div');
        el.className = 'tile' + (t.merged ? ' merged' : '') + (t.isNew ? ' new' : '');
        tileEls.set(t.id, el);
        tilesEl.appendChild(el);
      }
      const s = tileStyle(t.v);
      el.textContent = t.v;
      el.classList.toggle('big', t.v >= 128 && t.v < 1024);
      el.classList.toggle('huge', t.v >= 1024);
      el.style.background = s.bg;
      el.style.color = s.fg;
      el.style.setProperty('--pos', p);
      el.style.transform = p;
    }
    for (const [id, el] of tileEls) if (!seen.has(id)) { el.remove(); tileEls.delete(id); }
    scoreEl.textContent = Shell.fmt(score);
    undoBtn.disabled = !history.length;
  }

  document.addEventListener('keydown', (e) => {
    const d = Shell.KEY_DIRS[e.key];
    if (d) { e.preventDefault(); move(d); return; }
    if (e.key === 'u' || e.key === 'U' || ((e.ctrlKey || e.metaKey) && e.key === 'z')) { e.preventDefault(); undo(); }
    if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey) newGame();
  });
  Shell.swipe(boardEl, move);
  undoBtn.addEventListener('click', undo);
  document.getElementById('restart').addEventListener('click', newGame);
  Shell.onTheme(() => render());

  const saved = Shell.get('2048.state', null);
  if (saved && saved.grid) {
    grid = emptyGrid(); history = [];
    load(saved);
    render();
  } else {
    newGame();
  }
})();
</script>
</body>
</html>
