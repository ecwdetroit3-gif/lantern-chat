<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connect Four · Lantern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="shell.css">
<style>
.stage { container-type: size; flex-direction: column; gap: 12px; }
.turn { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; min-height: 22px; }
.turn i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
.board {
  width: min(100cqw, calc((100cqh - 34px) * 7 / 6), 560px);
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 1.4%;
  padding: 2%; border-radius: 16px; background: var(--sunk); box-shadow: var(--shadow);
}
.col {
  display: grid; grid-template-rows: repeat(6, 1fr); padding: 0; border: 0; background: none;
  border-radius: 10px; touch-action: manipulation;
}
.col:not(:disabled):hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.col:disabled { cursor: default; }
.slot { aspect-ratio: 1; position: relative; }
.slot::before { content: ""; position: absolute; inset: 8%; border-radius: 50%; background: var(--surface); }
.disc { position: absolute; inset: 8%; border-radius: 50%; z-index: 1; }
.disc.p1 { background: var(--accent); }
.disc.p2 { background: var(--ink); }
.disc.drop { animation: drop var(--t, 300ms) cubic-bezier(.4, 0, 1, 1); }
.disc.win { box-shadow: inset 0 0 0 4px var(--surface), inset 0 0 0 7px currentColor; }
.disc.p1.win { color: var(--ink); }
.disc.p2.win { color: var(--accent); }
@keyframes drop { from { transform: translateY(var(--from)); } }
@media (prefers-reduced-motion: reduce) { .disc.drop { animation: none; } }
@media (max-width: 560px) {
  .game-top { flex-wrap: wrap; }
  .game-top .seg { order: 5; width: 100%; }
  .game-top .seg button { flex: 1; }
}
</style>
</head>
<body>
<header class="game-top">
  <a class="icon-btn" href="../" aria-label="All games" title="All games"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 4 6 9l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <h1 class="hide-sm">Connect Four</h1>
  <div class="seg" role="group" aria-label="Opponent">
    <button type="button" data-mode="cpu" aria-pressed="true">vs Computer</button>
    <button type="button" data-mode="duo" aria-pressed="false">2 Players</button>
  </div>
  <div class="stats">
    <div class="stat"><span>Wins</span><b id="wins">0</b></div>
    <div class="stat"><span>Losses</span><b id="losses">0</b></div>
  </div>
  <button class="icon-btn" id="restart" type="button" aria-label="New game" title="New game (R)"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M14.5 9a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</header>
<main class="stage">
  <div class="turn" id="turn" aria-live="polite"></div>
  <div class="board" id="board" aria-label="Connect Four board"></div>
</main>
<p class="help"><span class="keys">Click a column, or press <kbd>1</kbd>–<kbd>7</kbd> · </span>Line up four of your color in a row, column or diagonal.</p>
<script src="shell.js"></script>
<script>
(function () {
  const ROWS = 6, COLS = 7;
  const boardEl = document.getElementById('board');
  const turnEl = document.getElementById('turn');
  const winsEl = document.getElementById('wins');
  const lossesEl = document.getElementById('losses');
  let mode = Shell.get('connect4.mode', 'cpu');
  if (mode !== 'cpu' && mode !== 'duo') mode = 'cpu';
  let board, turn, over, busy, starter = 1, gameId = 0;

  for (let c = 0; c < COLS; c++) {
    const col = document.createElement('button');
    col.type = 'button';
    col.className = 'col';
    col.dataset.c = c;
    col.setAttribute('aria-label', 'Column ' + (c + 1));
    col.innerHTML = '<div class="slot"></div>'.repeat(ROWS);
    boardEl.appendChild(col);
  }
  const slot = (r, c) => boardEl.children[c].children[r];

  function record() {
    winsEl.textContent = Shell.get('connect4.wins', 0);
    lossesEl.textContent = Shell.get('connect4.losses', 0);
  }
  record();

  function name(p) {
    if (mode === 'cpu') return p === 1 ? 'Your' : 'Computer’s';
    return p === 1 ? 'Amber’s' : 'Dark’s';
  }
  function showTurn(text, p) {
    turnEl.innerHTML = '';
    if (p) {
      const dot = document.createElement('i');
      dot.style.background = p === 1 ? 'var(--accent)' : 'var(--ink)';
      turnEl.appendChild(dot);
    }
    turnEl.appendChild(document.createTextNode(text));
  }

  function newGame() {
    board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    over = false; busy = false; gameId++;
    // Take turns going first; against the computer you start every other game.
    turn = starter; starter = 3 - starter;
    boardEl.querySelectorAll('.slot').forEach((s) => { s.textContent = ''; });
    document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    Shell.hideOverlay();
    nextTurn();
  }

  function nextTurn() {
    updateCols();
    if (mode === 'cpu' && turn === 2) {
      showTurn('Computer is thinking…', 2);
      busy = true; updateCols();
      const id = gameId;
      setTimeout(() => {
        if (id !== gameId) return;
        busy = false;
        play(bestMove());
      }, 350);
    } else {
      showTurn(name(turn) + ' turn', turn);
    }
  }

  function updateCols() {
    for (let c = 0; c < COLS; c++) boardEl.children[c].disabled = over || busy || board[0][c] !== 0;
  }

  function lowest(b, c) {
    for (let r = ROWS - 1; r >= 0; r--) if (!b[r][c]) return r;
    return -1;
  }

  function play(c) {
    if (over || c < 0 || c >= COLS) return;
    const r = lowest(board, c);
    if (r < 0) return;
    board[r][c] = turn;
    const disc = document.createElement('div');
    disc.className = 'disc drop p' + turn;
    // Fall from above the board. A disc is 84% of its slot, so one row is 1 / 0.84 disc heights.
    disc.style.setProperty('--from', `calc(-${((r + 1) / 0.84) * 100}% - 12px)`);
    disc.style.setProperty('--t', 160 + r * 45 + 'ms');
    slot(r, c).appendChild(disc);
    const line = winLine(board, r, c);
    if (line) return finish(turn, line);
    if (board[0].every(Boolean)) return finish(0);
    turn = 3 - turn;
    nextTurn();
  }

  function winLine(b, r, c) {
    const p = b[r][c];
    for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      const cells = [[r, c]];
      for (const s of [1, -1]) {
        let rr = r + dr * s, cc = c + dc * s;
        while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && b[rr][cc] === p) { cells.push([rr, cc]); rr += dr * s; cc += dc * s; }
      }
      if (cells.length >= 4) return cells;
    }
    return null;
  }

  function finish(winner, line) {
    over = true; updateCols();
    if (line) line.forEach(([r, c]) => slot(r, c).firstChild.classList.add('win'));
    let title;
    if (!winner) title = 'Draw';
    else if (mode === 'cpu') title = winner === 1 ? 'You win' : 'The computer wins';
    else title = (winner === 1 ? 'Amber' : 'Dark') + ' wins';
    if (mode === 'cpu' && winner) {
      const key = winner === 1 ? 'connect4.wins' : 'connect4.losses';
      Shell.set(key, Shell.get(key, 0) + 1);
      record();
      Shell.card('connect4', Shell.get('connect4.wins', 0) + ' wins · ' + Shell.get('connect4.losses', 0) + ' losses');
    }
    showTurn(title, winner);
    setTimeout(() => Shell.overlay(title, '', [
      { label: 'Play again', primary: true, onClick: newGame },
      { label: 'Look at the board', onClick: Shell.hideOverlay },
    ]), 700);
  }

  // Computer: alpha-beta search, center columns first, scoring every window of four.
  const ORDER = [3, 2, 4, 1, 5, 0, 6];
  function scoreWindow(a, b, c, d, p) {
    let mine = 0, theirs = 0;
    for (const v of [a, b, c, d]) { if (v === p) mine++; else if (v) theirs++; }
    if (mine && theirs) return 0;
    if (mine === 3) return 6;
    if (mine === 2) return 2;
    if (theirs === 3) return -7;
    if (theirs === 2) return -2;
    return 0;
  }
  function evaluate(b, p) {
    let s = 0;
    for (let r = 0; r < ROWS; r++) if (b[r][3] === p) s += 3; else if (b[r][3]) s -= 3;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (c + 3 < COLS) s += scoreWindow(b[r][c], b[r][c + 1], b[r][c + 2], b[r][c + 3], p);
      if (r + 3 < ROWS) s += scoreWindow(b[r][c], b[r + 1][c], b[r + 2][c], b[r + 3][c], p);
      if (r + 3 < ROWS && c + 3 < COLS) s += scoreWindow(b[r][c], b[r + 1][c + 1], b[r + 2][c + 2], b[r + 3][c + 3], p);
      if (r + 3 < ROWS && c - 3 >= 0) s += scoreWindow(b[r][c], b[r + 1][c - 1], b[r + 2][c - 2], b[r + 3][c - 3], p);
    }
    return s;
  }
  function negamax(b, depth, alpha, beta, p) {
    let any = false;
    for (const c of ORDER) {
      const r = lowest(b, c);
      if (r < 0) continue;
      any = true;
      b[r][c] = p;
      const won = winLine(b, r, c);
      b[r][c] = 0;
      if (won) return 10000 + depth;
    }
    if (!any) return 0;
    if (depth === 0) return evaluate(b, p);
    let best = -Infinity;
    for (const c of ORDER) {
      const r = lowest(b, c);
      if (r < 0) continue;
      b[r][c] = p;
      const v = -negamax(b, depth - 1, -beta, -alpha, 3 - p);
      b[r][c] = 0;
      if (v > best) best = v;
      if (v > alpha) alpha = v;
      if (alpha >= beta) break;
    }
    return best;
  }
  function bestMove() {
    const b = board.map((row) => row.slice());
    let best = -Infinity, choice = ORDER.find((c) => lowest(b, c) >= 0);
    for (const c of ORDER) {
      const r = lowest(b, c);
      if (r < 0) continue;
      b[r][c] = 2;
      const v = winLine(b, r, c) ? 100000 : -negamax(b, 5, -Infinity, Infinity, 1);
      b[r][c] = 0;
      if (v > best) { best = v; choice = c; }
    }
    return choice;
  }

  boardEl.addEventListener('click', (e) => {
    const col = e.target.closest('.col');
    if (!col || col.disabled || busy) return;
    if (mode === 'cpu' && turn !== 1) return;
    play(+col.dataset.c);
  });
  document.addEventListener('keydown', (e) => {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 7 && !busy && !over && !Shell.overlayOpen() && !(mode === 'cpu' && turn !== 1)) play(n - 1);
    if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey) newGame();
  });
  document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    Shell.set('connect4.mode', mode);
    starter = 1;
    newGame();
  }));
  document.getElementById('restart').addEventListener('click', newGame);

  newGame();
})();
</script>
</body>
</html>
