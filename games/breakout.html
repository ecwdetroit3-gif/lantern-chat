<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Breakout · Lantern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<header class="game-top">
  <a class="icon-btn" href="../" aria-label="All games" title="All games"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 4 6 9l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <h1>Breakout</h1>
  <div class="stats">
    <div class="stat"><span>Score</span><b id="score">0</b></div>
    <div class="stat"><span>Lives</span><b id="lives">3</b></div>
    <div class="stat hide-sm"><span>Best</span><b id="best">0</b></div>
  </div>
  <button class="icon-btn" id="restart" type="button" aria-label="Restart" title="Restart (R)"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M14.5 9a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="icon-btn hide-sm" id="fullscreen" type="button" aria-label="Full screen" title="Full screen"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 7V3h4M15 7V3h-4M3 11v4h4M15 11v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</header>
<main class="stage" id="stage"><canvas id="board" aria-label="Breakout board"></canvas></main>
<p class="help"><span class="keys">Move the mouse or <kbd>←</kbd><kbd>→</kbd> · <kbd>Space</kbd> or click to launch · <kbd>P</kbd> to pause · </span>Drag to move on touch screens</p>
<script src="shell.js"></script>
<script>
(function () {
  const W = 480, H = 640, COLS = 10, ROWS = 7, BRICK_H = 18, GAP = 4, TOP = 70;
  const BRICK_W = (W - GAP * (COLS + 1)) / COLS;
  const PADDLE_W = 84, PADDLE_H = 12, PADDLE_Y = H - 40, R = 7;
  const canvas = document.getElementById('board');
  const ctx = Shell.fit(canvas, W, H, draw);
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const bestEl = document.getElementById('best');

  let bricks, paddleX, ball, stuck, score, lives, level, running, paused, last, keys = { left: false, right: false };
  bestEl.textContent = Shell.fmt(Shell.get('breakout.best', 0));

  function buildLevel() {
    bricks = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      // Later levels leave a few gaps and put tougher bricks on top.
      if (level > 1 && (r + c * 3 + level) % 7 === 0) continue;
      bricks.push({
        x: GAP + c * (BRICK_W + GAP), y: TOP + r * (BRICK_H + GAP), row: r,
        hits: level > 2 && r < 2 ? 2 : 1, points: (ROWS - r) * 10,
      });
    }
  }

  function speed() { return 330 + (level - 1) * 40; }

  function resetBall() {
    stuck = true;
    ball = { x: paddleX, y: PADDLE_Y - R - 1, vx: 0, vy: 0 };
  }

  function launch() {
    if (!stuck) return;
    stuck = false;
    const a = (Math.random() * 0.6 - 0.3);
    ball.vx = Math.sin(a) * speed();
    ball.vy = -Math.cos(a) * speed();
  }

  function newGame() {
    score = 0; lives = 3; level = 1; paddleX = W / 2;
    buildLevel(); resetBall();
    scoreEl.textContent = '0'; livesEl.textContent = lives;
    draw();
  }

  function step(dt) {
    const pv = 520;
    if (keys.left) paddleX -= pv * dt;
    if (keys.right) paddleX += pv * dt;
    paddleX = Math.max(PADDLE_W / 2, Math.min(W - PADDLE_W / 2, paddleX));
    if (stuck) { ball.x = paddleX; return; }

    // Small substeps keep the ball from tunneling through bricks.
    const n = Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / 4);
    for (let i = 0; i < n; i++) {
      ball.x += ball.vx * dt / n;
      ball.y += ball.vy * dt / n;
      if (ball.x < R) { ball.x = R; ball.vx = Math.abs(ball.vx); }
      if (ball.x > W - R) { ball.x = W - R; ball.vx = -Math.abs(ball.vx); }
      if (ball.y < R) { ball.y = R; ball.vy = Math.abs(ball.vy); }

      if (ball.vy > 0 && ball.y + R >= PADDLE_Y && ball.y + R <= PADDLE_Y + PADDLE_H + 6 &&
          ball.x >= paddleX - PADDLE_W / 2 - R && ball.x <= paddleX + PADDLE_W / 2 + R) {
        const hit = Math.max(-1, Math.min(1, (ball.x - paddleX) / (PADDLE_W / 2)));
        const a = hit * 1.05; // up to about 60 degrees off vertical
        const v = speed();
        ball.vx = Math.sin(a) * v;
        ball.vy = -Math.cos(a) * v;
        ball.y = PADDLE_Y - R;
      }

      for (let b = 0; b < bricks.length; b++) {
        const br = bricks[b];
        const cx = Math.max(br.x, Math.min(ball.x, br.x + BRICK_W));
        const cy = Math.max(br.y, Math.min(ball.y, br.y + BRICK_H));
        if ((ball.x - cx) ** 2 + (ball.y - cy) ** 2 > R * R) continue;
        const overlapX = Math.min(ball.x + R - br.x, br.x + BRICK_W - (ball.x - R));
        const overlapY = Math.min(ball.y + R - br.y, br.y + BRICK_H - (ball.y - R));
        if (overlapX < overlapY) ball.vx = ball.x < br.x + BRICK_W / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
        else ball.vy = ball.y < br.y + BRICK_H / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
        br.hits--;
        if (br.hits <= 0) {
          score += br.points;
          bricks.splice(b, 1);
        }
        scoreEl.textContent = Shell.fmt(score);
        break;
      }

      if (ball.y - R > H) return loseLife();
    }
    if (!bricks.length) {
      level++;
      buildLevel(); resetBall();
      paused = true;
      Shell.overlay('Level ' + level, 'The ball gets faster.', [{ label: 'Go', primary: true, onClick: resume }]);
    }
  }

  function loseLife() {
    lives--;
    livesEl.textContent = lives;
    if (lives <= 0) return gameOver();
    resetBall();
  }

  function gameOver() {
    running = false;
    const { best, isNew } = Shell.best('breakout', score);
    bestEl.textContent = Shell.fmt(best);
    Shell.card('breakout', 'Best ' + Shell.fmt(best));
    draw();
    Shell.overlay('Game over', 'Score ' + Shell.fmt(score) + ' · level ' + level + (isNew && score > 0 ? ' · new best' : ''),
      [{ label: 'Play again', primary: true, onClick: () => { newGame(); start(); } }]);
  }

  function loop(t) {
    if (!running) return;
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    if (!paused) step(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function start() {
    Shell.hideOverlay();
    if (running) return;
    running = true; paused = false; last = performance.now();
    requestAnimationFrame(loop);
  }
  function pause() {
    if (!running || paused) return;
    paused = true;
    Shell.overlay('Paused', '', [{ label: 'Resume', primary: true, onClick: resume }]);
  }
  function resume() { Shell.hideOverlay(); paused = false; last = performance.now(); }

  function draw() {
    if (!bricks) return;
    const c = Shell.colors;
    ctx.fillStyle = c.surface;
    ctx.fillRect(0, 0, W, H);
    for (const br of bricks) {
      const pct = 100 - br.row * 11;
      ctx.fillStyle = br.hits > 1 ? c.ink : Shell.mix(c.accent, c.surface, pct);
      ctx.beginPath();
      ctx.roundRect(br.x, br.y, BRICK_W, BRICK_H, 4);
      ctx.fill();
    }
    ctx.fillStyle = c.ink;
    ctx.beginPath();
    ctx.roundRect(paddleX - PADDLE_W / 2, PADDLE_Y, PADDLE_W, PADDLE_H, 6);
    ctx.fill();
    ctx.fillStyle = c.accent;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, R, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = c.muted;
    ctx.font = '500 13px "IBM Plex Mono", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('LEVEL ' + level, 12, 30);
    if (stuck && running && !paused) {
      ctx.textAlign = 'center';
      ctx.fillText('Click or press Space to launch', W / 2, H / 2 + 60);
    }
  }

  const stage = document.getElementById('stage');
  stage.addEventListener('pointermove', (e) => {
    if (paused || Shell.overlayOpen()) return;
    paddleX = Shell.point(canvas, e, W, H).x;
  });
  stage.addEventListener('pointerdown', (e) => {
    if (Shell.overlayOpen()) return;
    paddleX = Shell.point(canvas, e, W, H).x;
    if (running && !paused) launch();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { keys.left = true; e.preventDefault(); }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keys.right = true; e.preventDefault(); }
    if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); if (running && !paused) launch(); }
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') paused ? resume() : pause();
    if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey) { newGame(); start(); }
  });
  document.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });
  document.getElementById('restart').addEventListener('click', () => { newGame(); start(); });
  Shell.onHidden(() => { keys.left = keys.right = false; pause(); });

  newGame();
  Shell.overlay('Breakout', 'Bounce the ball off your paddle to smash every brick. You have three lives.',
    [{ label: 'Play', primary: true, onClick: start }]);
})();
</script>
</body>
</html>
