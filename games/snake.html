<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Snake · Lantern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<header class="game-top">
  <a class="icon-btn" href="../" aria-label="All games" title="All games"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 4 6 9l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <h1>Snake</h1>
  <div class="stats">
    <div class="stat"><span>Score</span><b id="score">0</b></div>
    <div class="stat"><span>Best</span><b id="best">0</b></div>
  </div>
  <button class="icon-btn" id="restart" type="button" aria-label="Restart" title="Restart (R)"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M14.5 9a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="icon-btn" id="fullscreen" type="button" aria-label="Full screen" title="Full screen"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 7V3h4M15 7V3h-4M3 11v4h4M15 11v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</header>
<main class="stage"><canvas id="board" aria-label="Snake board"></canvas></main>
<div class="pad">
  <button type="button" data-dir="left" aria-label="Left">◀</button>
  <button type="button" data-dir="up" aria-label="Up">▲</button>
  <button type="button" data-dir="down" aria-label="Down">▼</button>
  <button type="button" data-dir="right" aria-label="Right">▶</button>
</div>
<p class="help"><span class="keys"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>WASD</kbd> to steer · <kbd>P</kbd> to pause · </span>Swipe on touch screens</p>
<script src="shell.js"></script>
<script>
(function () {
  const N = 20, CELL = 24, W = N * CELL, H = N * CELL;
  const canvas = document.getElementById('board');
  const ctx = Shell.fit(canvas, W, H, draw);
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  let snake, dir, queue, food, score, running, paused, acc, last, dead;
  bestEl.textContent = Shell.fmt(Shell.get('snake.best', 0));

  function reset() {
    snake = [[8, 10], [7, 10], [6, 10], [5, 10]];
    dir = 'right'; queue = []; score = 0; acc = 0; dead = false;
    scoreEl.textContent = '0';
    placeFood();
    draw();
  }

  function placeFood() {
    const free = [];
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) {
      if (!snake.some(([sx, sy]) => sx === x && sy === y)) free.push([x, y]);
    }
    food = free[Math.floor(Math.random() * free.length)];
  }

  function turn(d) {
    const lastDir = queue.length ? queue[queue.length - 1] : dir;
    const [lx, ly] = DIRS[lastDir], [nx, ny] = DIRS[d];
    if (lx + nx === 0 && ly + ny === 0) return; // no reversing into yourself
    if (d !== lastDir && queue.length < 3) queue.push(d);
    if (!running && !dead && !Shell.overlayOpen()) start();
  }

  function step() {
    if (queue.length) dir = queue.shift();
    const [dx, dy] = DIRS[dir];
    const head = [snake[0][0] + dx, snake[0][1] + dy];
    const eating = food && head[0] === food[0] && head[1] === food[1];
    const body = eating ? snake : snake.slice(0, -1);
    if (head[0] < 0 || head[1] < 0 || head[0] >= N || head[1] >= N ||
        body.some(([x, y]) => x === head[0] && y === head[1])) {
      return gameOver();
    }
    snake.unshift(head);
    if (eating) {
      score++;
      scoreEl.textContent = Shell.fmt(score);
      if (snake.length === N * N) return gameOver(true);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function speed() { return Math.max(60, 120 - score * 2); }

  function loop(t) {
    if (!running) return;
    if (!paused) {
      acc += t - last;
      while (acc >= speed() && running) { acc -= speed(); step(); }
    }
    last = t;
    draw();
    requestAnimationFrame(loop);
  }

  function start() {
    Shell.hideOverlay();
    running = true; paused = false; acc = 0;
    last = performance.now();
    requestAnimationFrame(loop);
  }

  function gameOver(won) {
    running = false; dead = true;
    const { best, isNew } = Shell.best('snake', score);
    bestEl.textContent = Shell.fmt(best);
    Shell.card('snake', 'Best ' + Shell.fmt(best));
    draw();
    Shell.overlay(won ? 'You filled the board' : 'Game over',
      'Score ' + Shell.fmt(score) + (isNew && score > 0 ? ' · new best' : ''),
      [{ label: 'Play again', primary: true, onClick: () => { reset(); start(); } }]);
  }

  function pause() {
    if (!running || paused) return;
    paused = true;
    Shell.overlay('Paused', '', [{ label: 'Resume', primary: true, onClick: resume }]);
  }
  function resume() {
    Shell.hideOverlay();
    paused = false; last = performance.now();
  }

  function draw() {
    if (!snake) return;
    const c = Shell.colors;
    ctx.fillStyle = c.surface;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = c.sunk;
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) {
      if ((x + y) % 2) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }
    if (food) {
      ctx.fillStyle = c.danger;
      ctx.beginPath();
      ctx.arc(food[0] * CELL + CELL / 2, food[1] * CELL + CELL / 2, CELL * 0.36, 0, Math.PI * 2);
      ctx.fill();
    }
    snake.forEach(([x, y], i) => {
      ctx.fillStyle = i === 0 ? c.ink : c.accent;
      const pad = i === 0 ? 1 : 2;
      ctx.beginPath();
      ctx.roundRect(x * CELL + pad, y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 6);
      ctx.fill();
    });
  }

  document.addEventListener('keydown', (e) => {
    const d = Shell.KEY_DIRS[e.key];
    if (d) { e.preventDefault(); if (!paused) turn(d); return; }
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { paused ? resume() : pause(); }
    if (e.key === 'r' || e.key === 'R') { reset(); start(); }
  });
  Shell.swipe(canvas, (d) => { if (!paused) turn(d); });
  document.querySelectorAll('.pad button').forEach((b) => {
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); if (!paused) turn(b.dataset.dir); });
  });
  document.getElementById('restart').addEventListener('click', () => { reset(); start(); });
  Shell.onHidden(pause);

  reset();
  Shell.overlay('Snake', 'Eat the red dots to grow. Don’t hit the walls or your own tail.',
    [{ label: 'Play', primary: true, onClick: start }]);
})();
</script>
</body>
</html>
